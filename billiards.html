const BallState=Object.freeze({ACTIVE:"ACTIVE",SINKING:"SINKING",POCKETED:"POCKETED"});
const VIEW={width:1400,height:800};
/* 台面物理区严格为 1200×600，即 2:1。中八球半径 15，斯诺克球半径 10.5。 */
const TABLE={left:100,right:1300,top:100,bottom:700,width:1200,height:600,ballR:15,snookerBallR:10.5};
const POCKETS=[{x:95,y:95,r:29,type:"corner"},{x:700,y:93,r:23,type:"side"},{x:1305,y:95,r:29,type:"corner"},{x:95,y:705,r:29,type:"corner"},{x:700,y:707,r:23,type:"side"},{x:1305,y:705,r:29,type:"corner"}];

const CUSHION_SEGMENTS=[[128,100,678,100],[722,100,1272,100],[128,700,678,700],[722,700,1272,700],[100,128,100,672],[1300,128,1300,672]];

  {cx:128,cy:90,r:10,a0:Math.PI/2,a1:Math.PI},{cx:678,cy:90,r:10,a0:0,a1:Math.PI/2},
  {cx:722,cy:90,r:10,a0:Math.PI/2,a1:Math.PI},{cx:1272,cy:90,r:10,a0:0,a1:Math.PI/2},

];
const ui={p1:document.querySelector("#p1"),p2:document.querySelector("#p2"),g1:document.querySelector("#g1"),g2:document.querySelector("#g2"),status:document.querySelector("#status"),powerFill:document.querySelector("#powerFill"),powerText:document.querySelector("#powerText"),confirm:document.querySelector("#confirmBall"),guide:document.querySelector("#toggleGuide"),restart:document.querySelector("#restart"),log:document.querySelector("#log"),toast:document.querySelector("#toast")};
const touchInterface=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>1,fullscreenButton=document.querySelector("#fullscreenButton");
const modeRow=document.createElement("label");modeRow.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#91a09a;font-size:12px";modeRow.innerHTML='<span>游戏模式</span><select id="gameMode" style="background:#17231f;color:#fff;border:1px solid #3a4c45;border-radius:6px;padding:6px"><option value="EIGHT">中式八球</option><option value="SNOOKER">斯诺克</option></select>';document.querySelector(".players-panel").insertBefore(modeRow,document.querySelector(".players"));const modeSelect=modeRow.querySelector("select");
const spinPanel=document.createElement("section");spinPanel.className="panel spin-panel";spinPanel.innerHTML='<h2>母球击打位置</h2><div style="display:grid;place-items:center"><canvas id="spinControl" width="150" height="150" style="width:150px;height:150px;max-width:100%;touch-action:none;cursor:crosshair"></canvas><div style="font-size:10px;color:#91a09a;margin-top:3px">拖动击点 · 双击归中</div></div>';document.querySelector(".power-panel").insertAdjacentElement("afterend",spinPanel);const spinCanvas=spinPanel.querySelector("#spinControl"),spinCtx=spinCanvas.getContext("2d");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),len=(x,y)=>Math.hypot(x,y),groupOf=id=>id>=1&&id<=7?"SOLID":id>=9&&id<=15?"STRIPE":id===8?"EIGHT":"CUE",groupName=g=>g==="SOLID"?"全色":g==="STRIPE"?"花色":"未分色";
function darken(hex,factor){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return`rgb(${Math.round(r*factor)},${Math.round(g*factor)},${Math.round(b*factor)})`}

class Ball{
  constructor(id,x,y,options={}){this.id=id;this.x=x;this.y=y;this.vx=0;this.vy=0;this.radius=options.radius||TABLE.ballR;this.mass=1;this.rollingFriction=options.rollingFriction??.84;this.spinX=0;this.spinY=0;this.state=BallState.ACTIVE;this.sink=0;this.pocket=null;this.kind=options.kind||null;this.value=options.value||0;this.displayColor=options.color||null;this.spot=options.spot||null}
  get speed(){return Math.hypot(this.vx,this.vy)}
  update(dt){if(this.state===BallState.SINKING){this.sink+=dt*4;if(this.sink>=1)this.state=BallState.POCKETED;return}if(this.state!==BallState.ACTIVE)return;this.x+=this.vx*dt;this.y+=this.vy*dt;/* 指数滚动阻尼按真实时间计算，不受帧率或 CCD 子步数量影响。v(t)=v0·e^(-kt)。 */const drag=Math.exp(-this.rollingFriction*dt);this.vx*=drag;this.vy*=drag;const spinDecay=Math.exp(-1.15*dt);this.spinX*=spinDecay;this.spinY*=spinDecay;/* 低于 5px/s 时直接静止，去掉末段几乎不可见的缓慢爬行。 */if(this.speed<5){this.vx=0;this.vy=0}}
}

class PhysicsEngine{
  constructor(game){this.game=game;this.restitution=.94;this.railRestitution=game.mode==="SNOOKER"?.86:.82}
  step(frameDt){
    const active=this.game.balls.filter(b=>b.state===BallState.ACTIVE),maxSpeed=Math.max(0,...active.map(b=>b.speed)),minRadius=Math.min(TABLE.ballR,...active.map(b=>b.radius));
    /* CCD 防穿模：根据本帧最快球的位移动态增加子步，使每个子步位移不超过球半径的 1/3。 */

    for(let s=0;s<subSteps;s++){for(const b of this.game.balls)b.update(dt);/* 落袋优先级高于球球与库边碰撞，进入黑洞后本子步立刻退出刚体系统。 */for(const b of active)this.checkPocket(b);for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++)this.resolveBallCollision(active[i],active[j]);for(const b of active)if(b.state===BallState.ACTIVE)this.resolveRails(b)}
  }
  resolveBallCollision(a,b){
    if(a.state!==BallState.ACTIVE||b.state!==BallState.ACTIVE)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.radius+b.radius;if(d>=min)return;if(d<.001){dx=.001;dy=0;d=.001}
    const nx=dx/d,ny=dy/d,overlap=min-d,totalInv=1/a.mass+1/b.mass;
    a.x-=nx*overlap*(1/a.mass)/totalInv;b.x+=nx*overlap*(1/b.mass)/totalInv;a.y-=ny*overlap*(1/a.mass)/totalInv;b.y+=ny*overlap*(1/b.mass)/totalInv;
    /* 将相对速度投影到碰撞法向。切向分量保持不变，法向分量按恢复系数反向；冲量公式同时满足动量守恒。 */
    const rvx=b.vx-a.vx,rvy=b.vy-a.vy,normalSpeed=rvx*nx+rvy*ny;if(normalSpeed>=0)return;const impulse=-(1+this.restitution)*normalSpeed/totalInv,ix=impulse*nx,iy=impulse*ny;a.vx-=ix/a.mass;a.vy-=iy/a.mass;b.vx+=ix/b.mass;b.vy+=iy/b.mass;
    const cue=a.id===0?a:b.id===0?b:null,object=cue===a?b:cue===b?a:null;if(cue&&object&&!this.game.shot.firstContact){this.game.shot.firstContact=object.id;const forwardX=cue===a?nx:-nx,forwardY=cue===a?ny:-ny,tangentX=-forwardY,tangentY=forwardX,impact=Math.max(0,-normalSpeed),topSpin=-cue.spinY;/* 高杆保留沿碰撞法向的跟进速度，低杆产生反向拉杆；左右塞沿切向改变母球分离角。 */cue.vx+=forwardX*topSpin*impact*.34+tangentX*cue.spinX*impact*.22;cue.vy+=forwardY*topSpin*impact*.34+tangentY*cue.spinX*impact*.22;cue.spinX*=.72;cue.spinY*=.68}

function raycast(ox,oy,dx,dy,balls,useJaws=false){let best={t:2200,type:"NONE"},cue=balls.find(b=>b.id===0),cueRadius=cue?.radius||TABLE.ballR;for(const b of balls){if(b.id===0||b.state!==BallState.ACTIVE)continue;const rx=ox-b.x,ry=oy-b.y,R=cueRadius+b.radius,B=2*(rx*dx+ry*dy),C=rx*rx+ry*ry-R*R,disc=B*B-4*C;if(disc>=0){const t=(-B-Math.sqrt(disc))/2;if(t>0&&t<best.t)best={t,type:"BALL"}}}
  const accept=(t,nx,ny,min,max,horizontal)=>{if(t<=0||t>=best.t)return;const along=horizontal?ox+dx*t:oy+dy*t;if(along>=min&&along<=max)best={t,nx,ny,type:"RAIL"}};
  if(Math.abs(dy)>.0001){accept((TABLE.top+cueRadius-oy)/dy,0,1,128,678,true);accept((TABLE.top+cueRadius-oy)/dy,0,1,722,1272,true);accept((TABLE.bottom-cueRadius-oy)/dy,0,-1,128,678,true);accept((TABLE.bottom-cueRadius-oy)/dy,0,-1,722,1272,true)}
  if(Math.abs(dx)>.0001){accept((TABLE.left+cueRadius-ox)/dx,1,0,128,672,false);accept((TABLE.right-cueRadius-ox)/dx,-1,0,128,672,false)}
  if(useJaws)for(const jaw of JAW_ARCS){const rx=ox-jaw.cx,ry=oy-jaw.cy,R=jaw.r+cueRadius,B=2*(rx*dx+ry*dy),C=rx*rx+ry*ry-R*R,disc=B*B-4*C;if(disc<0)continue;const t=(-B-Math.sqrt(disc))/2;if(t<=0||t>=best.t)continue;const hx=ox+dx*t,hy=oy+dy*t,nx=(hx-jaw.cx)/R,ny=(hy-jaw.cy)/R;let angle=Math.atan2(hy-jaw.cy,hx-jaw.cx);if(angle<0)angle+=Math.PI*2;if(angle>=jaw.a0&&angle<=jaw.a1)best={t,nx,ny,type:"RAIL"}}
  return{x:ox+dx*best.t,y:oy+dy*best.t,...best}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function notify(text){ui.toast.textContent=text;ui.toast.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>ui.toast.classList.remove("show"),1900)}
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*VIEW.width/r.width,y:(e.clientY-r.top)*VIEW.height/r.height}}
function drawSpinControl(spin={x:0,y:0}){const c=75,r=49;spinCtx.clearRect(0,0,150,150);spinCtx.fillStyle="#91a09a";spinCtx.font='11px "Microsoft YaHei",sans-serif';spinCtx.textAlign="center";spinCtx.fillText("高杆",c,12);spinCtx.fillText("低杆",c,146);spinCtx.fillText("左塞",18,79);spinCtx.fillText("右塞",132,79);const gradient=spinCtx.createRadialGradient(58,55,4,c,c,r);gradient.addColorStop(0,"#fff");gradient.addColorStop(.72,"#e9ecea");gradient.addColorStop(1,"#aeb6b2");spinCtx.fillStyle=gradient;spinCtx.shadowColor="#0009";spinCtx.shadowBlur=8;spinCtx.beginPath();spinCtx.arc(c,c,r,0,Math.PI*2);spinCtx.fill();spinCtx.shadowColor="transparent";spinCtx.strokeStyle="#7f8d87";spinCtx.lineWidth=1.5;spinCtx.stroke();spinCtx.strokeStyle="#7a898344";spinCtx.setLineDash([3,4]);spinCtx.beginPath();spinCtx.moveTo(c-r+5,c);spinCtx.lineTo(c+r-5,c);spinCtx.moveTo(c,c-r+5);spinCtx.lineTo(c,c+r-5);spinCtx.stroke();spinCtx.setLineDash([]);const x=c+spin.x*(r-8),y=c+spin.y*(r-8);spinCtx.fillStyle="#dc3f38";spinCtx.shadowColor="#0008";spinCtx.shadowBlur=4;spinCtx.beginPath();spinCtx.arc(x,y,6,0,Math.PI*2);spinCtx.fill();spinCtx.shadowColor="transparent";spinCtx.strokeStyle="#7b1715";spinCtx.stroke()}

async function roomApi(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.error||"网络请求失败");return payload}
class RoomClient{
  constructor(roomId){this.roomId=roomId;this.room=null;this.me=null;this.myIndex=-1;this.events=null;this.awaitingShot=false;this.authoritativeShot=false;this.bar=null}
  async init(){try{const result=await roomApi(`/api/rooms/${this.roomId}`);this.room=result.room;this.me=result.me;if(this.room.status!=="STARTED")throw Error("房间尚未开始");this.myIndex=this.room.host.id===this.me.id?0:1;modeSelect.value=this.room.mode;modeSelect.disabled=true;game.reset();ui.p1.querySelector("b").textContent=this.room.host.username;ui.p2.querySelector("b").textContent=this.room.guest.username;if(this.room.game.snapshot)this.applySnapshot(this.room.game.snapshot);if(this.room.game.rolling&&this.room.game.lastAction)this.playShot(this.room.game.lastAction,this.room.game.activeShooter);this.renderBar();this.events=new EventSource("/api/events");this.events.onmessage=event=>this.handle(JSON.parse(event.data));this.events.onerror=()=>this.setBarText("正在重连…")}catch(error){alert(error.message);location.href="/lobby.html"}}
  canAct(){return this.room?.status==="STARTED"&&!this.room.game.rolling&&!this.awaitingShot&&this.myIndex===this.room.game.currentTurn&&this.myIndex===game.rule.currentTurn&&game.gameState!==GameState.ROLLING&&game.gameState!==GameState.RULE_EVALUATION&&game.gameState!==GameState.GAME_OVER}
  async submitShot(action){if(!this.canAct()){game.gameState=GameState.AIMING;game.updateUI();notify("等待对手回合");return}this.awaitingShot=true;game.gameState=GameState.RULE_EVALUATION;game.updateUI();try{await roomApi(`/api/rooms/${this.roomId}/action`,{method:"POST",body:JSON.stringify({type:"SHOT",...action})})}catch(error){this.awaitingShot=false;game.gameState=GameState.AIMING;game.updateUI();this.refreshControlLock();notify(error.message)}}
  playShot(action,senderId){this.awaitingShot=false;this.room.game.rolling=true;this.authoritativeShot=senderId===this.me.id;game.aim={...action.aim};game.power=action.power;game.cueSpin={...action.spin};game.cue.x=action.cue.x;game.cue.y=action.cue.y;if(game.mode==="SNOOKER")game.rule.nominatedFreeBallId=action.freeBallId;game.gameState=GameState.POWER_CHARGING;game.shoot(true);this.renderBar()}
  handle(message){if(message.roomId&&message.roomId!==this.roomId)return;if(message.type==="ROOM_ACTION"&&message.action?.type==="SHOT")this.playShot(message.action,message.senderId);else if(message.type==="ROOM_STATE"){this.room.game.rolling=false;this.applySnapshot(message.snapshot);this.authoritativeShot=false;this.renderBar()}else if(message.type==="ROOM_CLOSED"){alert(message.reason||"房间已关闭");location.href="/lobby.html"}}
  snapshot(){return{mode:game.mode,gameState:game.gameState,winner:game.winner,currentTurn:game.rule.currentTurn,balls:game.balls.map(ball=>({id:ball.id,x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy,state:ball.state,sink:ball.sink,spinX:ball.spinX,spinY:ball.spinY})),rule:game.mode==="SNOOKER"?{scores:[...game.rule.scores],currentLegalTarget:game.rule.currentLegalTarget,clearanceValue:game.rule.clearanceValue,freeBallAvailable:game.rule.freeBallAvailable,nominatedFreeBallId:game.rule.nominatedFreeBallId}:{playerGroups:[...game.rule.playerGroups]}}}
  applySnapshot(snapshot){if(!snapshot||snapshot.mode!==game.mode)return;for(const state of snapshot.balls||[]){const ball=game.balls.find(item=>item.id===state.id);if(ball)Object.assign(ball,state)}game.winner=snapshot.winner??null;game.rule.currentTurn=snapshot.currentTurn;if(this.room)this.room.game.currentTurn=snapshot.currentTurn;if(game.mode==="SNOOKER"){Object.assign(game.rule,snapshot.rule||{});if(snapshot.rule?.scores)game.rule.scores=[...snapshot.rule.scores]}else if(snapshot.rule?.playerGroups)game.rule.playerGroups=[...snapshot.rule.playerGroups];game.gameState=snapshot.gameState||GameState.AIMING;game.updateUI()}
  async publishState(){this.authoritativeShot=false;try{await roomApi(`/api/rooms/${this.roomId}/action`,{method:"POST",body:JSON.stringify({type:"STATE",snapshot:this.snapshot()})})}catch(error){notify(`同步失败：${error.message}`)}}
  renderBar(){if(!this.bar){this.bar=document.createElement("div");this.bar.className="network-room";document.body.appendChild(this.bar)}const turn=this.room.game.currentTurn===0?this.room.host.username:this.room.guest.username;this.bar.innerHTML=`<span>房间 <b>${this.roomId.slice(-6).toUpperCase()}</b></span><span>${this.room.mode==="SNOOKER"?"斯诺克":"中式八球"}</span><span id="netTurn">${game.gameState===GameState.ROLLING?"击球中":`轮到 ${turn}`}</span><button>退出房间</button>`;this.bar.querySelector("button").onclick=()=>this.exit();this.refreshControlLock()}
  refreshControlLock(){if(!this.room)return;const myTurn=this.myIndex===this.room.game.currentTurn&&this.myIndex===game.rule.currentTurn,interactive=this.canAct();canvas.style.cursor=interactive?"crosshair":"not-allowed";spinCanvas.style.pointerEvents=interactive?"auto":"none";spinPanel.style.opacity=interactive?"1":".48";if(!myTurn&&!this.room.game.rolling&&game.gameState!==GameState.GAME_OVER){const opponent=this.room.game.currentTurn===0?this.room.host.username:this.room.guest.username;ui.status.textContent=`等待 ${opponent} 击球，你当前只能观看`;ui.confirm.disabled=true}}
  setBarText(text){const el=this.bar?.querySelector("#netTurn");if(el)el.textContent=text}
  async exit(){if(!confirm("确定退出房间？进行中的对局将结束。"))return;try{await roomApi(`/api/rooms/${this.roomId}/exit`,{method:"POST"})}finally{location.href="/lobby.html"}}
}
let roomClient=null,game=new BilliardsGame(),renderer=new Renderer(game),last=performance.now();
function selectFreeBallAt(p){if(game.mode!=="SNOOKER"||!game.rule.freeBallAvailable)return false;const selected=game.balls.find(ball=>ball.id!==0&&ball.state===BallState.ACTIVE&&Math.hypot(p.x-ball.x,p.y-ball.y)<=ball.radius+10);if(selected&&game.rule.nominateFreeBall(selected)){notify("自由球已指定");return true}return false}
let spinDragging=false;spinCanvas.addEventListener("pointerdown",e=>{if(roomClient&&!roomClient.canAct())return notify("等待对手回合");spinDragging=true;spinCanvas.setPointerCapture(e.pointerId);setSpinFromPointer(e)});spinCanvas.addEventListener("pointermove",e=>{if(spinDragging&&(!roomClient||roomClient.canAct()))setSpinFromPointer(e)});spinCanvas.addEventListener("pointerup",()=>spinDragging=false);spinCanvas.addEventListener("pointercancel",()=>spinDragging=false);spinCanvas.addEventListener("dblclick",()=>{if(roomClient&&!roomClient.canAct())return notify("等待对手回合");game.cueSpin={x:0,y:0};drawSpinControl(game.cueSpin)});
/* 手机触摸与桌面鼠标使用两套输入状态：先滑动调方向，再直接拖动画面中的球杆蓄力出杆。 */
let touchGesture=null;
canvas.addEventListener("pointerdown",e=>{const mobilePointer=touchInterface&&e.pointerType!=="mouse";if(roomClient&&!roomClient.canAct()){notify("等待对手回合");return}const p=pointerPos(e),cue=game.cue;canvas.setPointerCapture(e.pointerId);
  if(mobilePointer){e.preventDefault();if(game.isBallInHand()&&Math.hypot(p.x-cue.x,p.y-cue.y)<Math.max(42,cue.radius+24)){game.draggingCue=true;touchGesture={id:e.pointerId,type:"BALL"};return}if(game.gameState!==GameState.AIMING)return;if(selectFreeBallAt(p))return;touchGesture={id:e.pointerId,type:"PENDING",start:p,startAngle:Math.atan2(game.aim.y,game.aim.x),axis:{...game.aim}};return}
  if(game.isBallInHand()&&Math.hypot(p.x-cue.x,p.y-cue.y)<35){game.draggingCue=true;return}if(game.gameState===GameState.AIMING){if(selectFreeBallAt(p))return;const dx=p.x-cue.x,dy=p.y-cue.y,d=Math.hypot(dx,dy);if(d>1){game.aim.x=dx/d;game.aim.y=dy/d}game.lockedAim={...game.aim};game.chargeStart=p;game.power=0;game.gameState=GameState.POWER_CHARGING;game.updateUI()}});
canvas.addEventListener("pointermove",e=>{if(roomClient&&!roomClient.canAct())return;const mobilePointer=touchInterface&&e.pointerType!=="mouse",p=pointerPos(e),cue=game.cue;
  if(mobilePointer){if(!touchGesture||touchGesture.id!==e.pointerId)return;e.preventDefault();if(touchGesture.type==="BALL"&&game.isBallInHand()){if(game.validCuePosition(p.x,p.y)){cue.x=p.x;cue.y=p.y};return}const dx=p.x-touchGesture.start.x,dy=p.y-touchGesture.start.y,axis=touchGesture.axis||game.lockedAim,parallel=dx*axis.x+dy*axis.y,perpendicular=dx*(-axis.y)+dy*axis.x,distance=Math.hypot(dx,dy);if(touchGesture.type==="PENDING"&&distance>12){/* 根据手势与球杆轴线的夹角分流：近似垂直为瞄准；只有明显沿轴线（约 39° 内）才进入拉杆。 */if(Math.abs(parallel)/distance>=.78){touchGesture.type="PULL";game.lockedAim={...axis};game.chargeStart=touchGesture.start;game.power=0;game.gameState=GameState.POWER_CHARGING;game.updateUI()}else touchGesture.type="AIM"}if(touchGesture.type==="AIM"&&game.gameState===GameState.AIMING){const angle=touchGesture.startAngle+perpendicular*.0045;game.aim={x:Math.cos(angle),y:Math.sin(angle)}}else if(touchGesture.type==="PULL"&&game.gameState===GameState.POWER_CHARGING){/* 只取沿球杆轴线的后拉分量，横向抖动不会改变力度和出杆方向。 */game.power=clamp(-parallel/210,0,1)}return}
  if(game.isBallInHand()&&game.draggingCue){if(game.validCuePosition(p.x,p.y)){cue.x=p.x;cue.y=p.y}}else if(game.gameState===GameState.AIMING){const dx=p.x-cue.x,dy=p.y-cue.y,d=Math.hypot(dx,dy);if(d>1){game.aim.x=dx/d;game.aim.y=dy/d}}else if(game.gameState===GameState.POWER_CHARGING&&game.chargeStart){/* 桌面端方向已锁定，鼠标越过白球也只改变拉杆距离。 */const mx=p.x-game.chargeStart.x,my=p.y-game.chargeStart.y,pull=-(mx*game.lockedAim.x+my*game.lockedAim.y);game.power=clamp(pull/190,0,1)}});
function releaseTablePointer(e){const mobilePointer=touchInterface&&e.pointerType!=="mouse";if(mobilePointer){const gesture=touchGesture?.id===e.pointerId?touchGesture:null;touchGesture=null;game.draggingCue=false;if(gesture?.type==="PULL"&&game.gameState===GameState.POWER_CHARGING){if(e.type==="pointerup"&&game.power>=.015){game.aim={...game.lockedAim};game.chargeStart=null;game.shoot()}else{game.power=0;game.chargeStart=null;game.gameState=GameState.AIMING;game.updateUI()}}return}if(roomClient&&!roomClient.canAct()){game.draggingCue=false;return}if(game.isBallInHand()){game.draggingCue=false;return}if(game.gameState===GameState.POWER_CHARGING){game.aim={...game.lockedAim};game.chargeStart=null;game.shoot()}}
canvas.addEventListener("pointerup",releaseTablePointer);canvas.addEventListener("pointercancel",releaseTablePointer);
async function toggleFullscreen(){try{const active=document.fullscreenElement||document.webkitFullscreenElement;if(active){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);return}const root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen;if(!request)return notify("当前浏览器不支持网页全屏，请使用浏览器菜单进入全屏");await request.call(root);try{await screen.orientation?.lock?.("landscape")}catch{}}catch(error){notify("无法进入全屏，请检查浏览器权限")}}
function updateFullscreenButton(){fullscreenButton.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?"⛶ 退出":"⛶ 全屏"}
fullscreenButton.addEventListener("click",toggleFullscreen);document.addEventListener("fullscreenchange",updateFullscreenButton);document.addEventListener("webkitfullscreenchange",updateFullscreenButton);
ui.confirm.onclick=()=>{if(roomClient&&!roomClient.canAct())return notify("等待对手回合");if(game.isBallInHand()&&game.validCuePosition(game.cue.x,game.cue.y)){game.gameState=GameState.AIMING;if(game.mode==="SNOOKER"&&game.pendingFreeBallCheck){game.pendingFreeBallCheck=false;game.rule.armFreeBall()}game.updateUI()}};ui.guide.onclick=()=>{game.guide=!game.guide;ui.guide.textContent=`辅助线：${game.guide?"开":"关"}`};ui.restart.onclick=()=>{if(roomClient)return notify("联机房间不能单独重新摆球");game.reset()};modeSelect.onchange=()=>{if(!modeSelect.disabled)game.reset()};
function frame(now){const dt=Math.min(.025,(now-last)/1000);last=now;game.update(dt);renderer.draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
const roomId=new URLSearchParams(location.search).get("room");if(roomId){roomClient=new RoomClient(roomId);roomClient.init()}
