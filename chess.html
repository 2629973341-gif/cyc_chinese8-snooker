<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黑金中国象棋 · 1V1</title>
<style>
:root{--bg:#110d09;--panel:#211810;--line:#533b27;--gold:#d3a75b;--text:#f2e9dc;--muted:#aa9985;--red:#bd3028;--black:#22201d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 25% 0,#3b2515 0,transparent 38%),var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif}button{font:inherit}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:13px;border-bottom:1px solid #3c2a1d}.brand small{color:var(--gold);letter-spacing:1.6px}.brand h1{font:700 24px Georgia,"STSong",serif;margin:2px 0}.room-code{font:700 13px ui-monospace;color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(420px,1fr) 290px;gap:18px;margin-top:16px}.board-card{position:relative;display:grid;place-items:center;min-width:0;padding:10px;border:1px solid #493522;border-radius:15px;background:#17110c;box-shadow:0 25px 60px #0009}.board{display:block;width:min(100%,720px);height:auto;aspect-ratio:19/21;touch-action:none;border-radius:8px}.side{display:grid;align-content:start;gap:12px}.panel{padding:14px;border:1px solid var(--line);border-radius:12px;background:#1b140f}.panel h2{font-size:11px;letter-spacing:1.5px;color:var(--gold);margin:0 0 10px}.players{display:grid;gap:7px}.player{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #493522;border-radius:8px;color:var(--muted)}.player.active{border-color:var(--gold);color:#fff;box-shadow:inset 3px 0 var(--gold)}.side-name{font-size:11px;padding:3px 7px;border-radius:12px;background:#302318}.status{padding:12px;border-radius:8px;background:#120e0b;line-height:1.6;font-size:13px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buttons button{border:1px solid #5b422c;border-radius:7px;background:#2b2017;color:var(--text);padding:9px;cursor:pointer}.buttons .danger{color:#ffaaa0;border-color:#714039}.log{min-height:105px;max-height:180px;overflow:auto;font-size:11px;color:var(--muted);line-height:1.7}.notice{position:absolute;z-index:5;top:18px;left:50%;translate:-50% -8px;opacity:0;pointer-events:none;padding:8px 15px;border:1px solid #80613d;border-radius:20px;background:#120d09eF;transition:.2s;white-space:nowrap}.notice.show{opacity:1;translate:-50% 0}.credit{font-size:10px;color:#786958}
.chess-alert{position:absolute;z-index:12;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;overflow:hidden}.chess-alert.show{opacity:1}.alert-card{position:relative;min-width:190px;padding:18px 34px;text-align:center;border:2px solid #ffd36b;background:#160d08eF;box-shadow:0 0 0 999px #16050055,0 0 45px #ff3b22aa;transform:scale(.35) rotate(-8deg);opacity:0}.chess-alert.show .alert-card{animation:alert-impact 1.45s cubic-bezier(.2,.9,.25,1) both}.alert-title{font:900 48px "STKaiti","KaiTi",serif;letter-spacing:8px;color:#ffdf82;text-shadow:0 3px #8e1e18,0 0 18px #ff3e28}.alert-sub{margin-top:3px;color:#f4d7b5;font-size:12px}.chess-alert.warning .alert-card{border-color:#ffcc55;box-shadow:0 0 0 999px #29190033,0 0 42px #ffb72f99}.chess-alert.warning .alert-title{font-size:34px;color:#ffe087;text-shadow:0 2px #845500,0 0 15px #ffb21f}.chess-alert.mate .alert-card{border-color:#fff0a0;box-shadow:0 0 0 999px #17000088,0 0 65px #ff2b20}.chess-alert.mate .alert-title{font-size:54px;color:#fff4b0}.alert-spark{position:absolute;left:50%;top:50%;width:5px;height:88px;background:linear-gradient(#ffd76b,transparent);transform-origin:50% 0;opacity:0}.chess-alert.show .alert-spark{animation:spark .8s .08s ease-out both}.board-card.alert-shake{animation:board-shake .38s linear}.board-card.in-check{animation:danger-pulse 1s ease-in-out infinite}@keyframes alert-impact{0%{opacity:0;transform:scale(.25) rotate(-12deg)}22%{opacity:1;transform:scale(1.18) rotate(2deg)}38%{transform:scale(.96)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}@keyframes spark{0%{opacity:1;transform:rotate(var(--r)) translateY(30px) scaleY(.2)}100%{opacity:0;transform:rotate(var(--r)) translateY(120px) scaleY(1)}}@keyframes board-shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,2px)}}@keyframes danger-pulse{50%{box-shadow:inset 0 0 38px #e32b20aa,0 0 25px #d52a2266}}@media(max-width:760px){html,body{overflow-x:hidden}.app{width:100%;max-width:520px;padding:6px 7px 18px}.top{padding:3px 3px 7px}.brand small{font-size:9px}.brand h1{font-size:18px}.room-code{max-width:46%;font-size:10px;text-align:right}.layout{display:flex;flex-direction:column;gap:8px;margin-top:7px}.board-card{width:100%;padding:3px;border-radius:9px;box-shadow:none}.board{width:100%;max-width:none}.side{display:grid;grid-template-columns:1fr 1fr;gap:7px}.panel{padding:8px;border-radius:9px}.panel h2{margin-bottom:6px;font-size:10px}.side .panel:first-child,.side .panel:last-of-type{grid-column:1/-1}.players{grid-template-columns:1fr 1fr}.player{padding:7px;font-size:12px}.side-name{font-size:9px;padding:2px 5px}.status{padding:8px;min-height:52px;font-size:12px}.buttons button{padding:9px 5px}.log{min-height:40px;max-height:70px}.credit{display:none}.alert-card{min-width:160px;padding:14px 25px}.alert-title{font-size:40px}}
</style>
</head>
<body>
<main class="app"><header class="top"><div class="brand"><small>CHINESE CHESS / ONLINE</small><h1>黑金中国象棋</h1></div><div class="room-code" id="roomCode"></div></header><div class="layout"><section class="board-card"><canvas id="board" class="board" width="760" height="840"></canvas><div id="notice" class="notice"></div></section><aside class="side"><section class="panel"><h2>棋手与回合</h2><div class="players"><div id="redPlayer" class="player"><strong id="redName">红方</strong><span class="side-name">红 · 帅</span></div><div id="blackPlayer" class="player"><strong id="blackName">黑方</strong><span class="side-name">黑 · 将</span></div></div></section><section class="panel"><h2>对局状态</h2><div id="status" class="status">正在连接服务器……</div></section><section class="panel"><h2>操作</h2><div class="buttons"><button id="resign" class="danger">认输</button><button id="exit">退出房间</button></div></section><section class="panel"><h2>棋局记录</h2><div id="log" class="log">红方先行</div></section><div class="credit">棋盘规则与原始项目思路来自 Chess-master（MIT License），联网状态及服务端校验为本项目实现。</div></aside></div></main>
<script>
"use strict";
const canvas=document.querySelector("#board"),ctx=canvas.getContext("2d"),roomId=new URLSearchParams(location.search).get("room"),ui={roomCode:document.querySelector("#roomCode"),red:document.querySelector("#redPlayer"),black:document.querySelector("#blackPlayer"),redName:document.querySelector("#redName"),blackName:document.querySelector("#blackName"),status:document.querySelector("#status"),log:document.querySelector("#log"),notice:document.querySelector("#notice"),resign:document.querySelector("#resign"),exit:document.querySelector("#exit")};
ui.boardCard=canvas.closest(".board-card");ui.alert=document.createElement("div");ui.alert.className="chess-alert";ui.alert.innerHTML='<div class="alert-card"><div class="alert-title"></div><div class="alert-sub"></div></div>';for(let i=0;i<12;i++){const spark=document.createElement("i");spark.className="alert-spark";spark.style.setProperty("--r",`${i*30}deg`);ui.alert.appendChild(spark)}ui.boardCard.appendChild(ui.alert);
ui.rematch=document.createElement("button");ui.rematch.textContent="再来一局";ui.rematch.hidden=true;ui.resign.parentElement.appendChild(ui.rematch);
const OX=80,OY=75,GX=75,GY=75,NAMES={c:"车",m:"马",x:"相",s:"仕",j:"帅",p:"炮",z:"兵",C:"車",M:"馬",X:"象",S:"士",J:"将",P:"砲",Z:"卒"};let room=null,me=null,myIndex=-1,state=null,selected=null,busy=false,events=null,dangerPoint=null,lastAlertKey="";
async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.error||"请求失败");return payload}
function toast(text){ui.notice.textContent=text;ui.notice.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>ui.notice.classList.remove("show"),1700)}
const sideOf=p=>p&&p[0]===p[0].toLowerCase()?0:1,typeOf=p=>p?.[0].toLowerCase(),inside=(x,y)=>x>=0&&x<9&&y>=0&&y<10;
function clearLine(board,fx,fy,tx,ty){let n=0;if(fx===tx)for(let y=Math.min(fy,ty)+1;y<Math.max(fy,ty);y++)if(board[y][fx])n++;else{}else if(fy===ty)for(let x=Math.min(fx,tx)+1;x<Math.max(fx,tx);x++)if(board[fy][x])n++;else{}else return-1;return n}
function pseudo(board,fx,fy,tx,ty){if(!inside(fx,fy)||!inside(tx,ty)||(fx===tx&&fy===ty))return false;const p=board[fy][fx],target=board[ty][tx];if(!p||target&&sideOf(target)===sideOf(p))return false;const side=sideOf(p),type=typeOf(p),dx=tx-fx,dy=ty-fy,ax=Math.abs(dx),ay=Math.abs(dy);if(type==="c")return(fx===tx||fy===ty)&&clearLine(board,fx,fy,tx,ty)===0;if(type==="m")return((ax===1&&ay===2)||(ax===2&&ay===1))&&!board[fy+(ay===2?Math.sign(dy):0)][fx+(ax===2?Math.sign(dx):0)];if(type==="x")return ax===2&&ay===2&&!board[fy+dy/2][fx+dx/2]&&(side===0?ty>=5:ty<=4);if(type==="s")return ax===1&&ay===1&&tx>=3&&tx<=5&&(side===0?ty>=7:ty<=2);if(type==="j"){if(target&&typeOf(target)==="j"&&fx===tx&&clearLine(board,fx,fy,tx,ty)===0)return true;return ax+ay===1&&tx>=3&&tx<=5&&(side===0?ty>=7:ty<=2)}if(type==="p"){const n=clearLine(board,fx,fy,tx,ty);return target?n===1:n===0}if(type==="z"){const forward=side===0?-1:1,crossed=side===0?fy<=4:fy>=5;return dx===0&&dy===forward||crossed&&dy===0&&ax===1}return false}
function kingInCheck(board,side){let king=null;for(let y=0;y<10;y++)for(let x=0;x<9;x++){const piece=board[y][x];if(piece&&sideOf(piece)===side&&typeOf(piece)==="j")king={x,y}}if(!king)return true;for(let y=0;y<10;y++)for(let x=0;x<9;x++){const piece=board[y][x];if(piece&&sideOf(piece)!==side&&pseudo(board,x,y,king.x,king.y))return true}return false}
function legalMove(board,side,from,to){if(!pseudo(board,from.x,from.y,to.x,to.y))return false;const next=board.map(row=>row.slice());next[to.y][to.x]=next[from.y][from.x];next[from.y][from.x]=null;return!kingInCheck(next,side)}
function showChessAlert(kind,title,sub){ui.alert.className=`chess-alert ${kind}`;ui.alert.querySelector(".alert-title").textContent=title;ui.alert.querySelector(".alert-sub").textContent=sub;ui.alert.classList.remove("show");ui.boardCard.classList.remove("alert-shake");void ui.alert.offsetWidth;ui.alert.classList.add("show");ui.boardCard.classList.add("alert-shake");clearTimeout(showChessAlert.timer);showChessAlert.timer=setTimeout(()=>{ui.alert.classList.remove("show");ui.boardCard.classList.remove("alert-shake")},1500)}
function toView(x,y){return myIndex===1?{x:8-x,y:9-y}:{x,y}}function fromView(x,y){return myIndex===1?{x:8-x,y:9-y}:{x,y}}function pixel(x,y){const p=toView(x,y);return{x:OX+p.x*GX,y:OY+p.y*GY}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBoard(){const bg=ctx.createLinearGradient(0,0,760,840);bg.addColorStop(0,"#d8af72");bg.addColorStop(.5,"#f0cf91");bg.addColorStop(1,"#c99558");ctx.fillStyle=bg;roundRect(12,12,736,816,22);ctx.fill();ctx.strokeStyle="#6d3c20";ctx.lineWidth=4;roundRect(24,24,712,792,16);ctx.stroke();ctx.strokeStyle="#704323";ctx.lineWidth=2;for(let y=0;y<10;y++){ctx.beginPath();ctx.moveTo(OX,OY+y*GY);ctx.lineTo(OX+8*GX,OY+y*GY);ctx.stroke()}for(let x=0;x<9;x++){ctx.beginPath();ctx.moveTo(OX+x*GX,OY);if(x!==0&&x!==8){ctx.lineTo(OX+x*GX,OY+4*GY);ctx.moveTo(OX+x*GX,OY+5*GY)}ctx.lineTo(OX+x*GX,OY+9*GY);ctx.stroke()}for(const offset of [0,7]){ctx.beginPath();ctx.moveTo(OX+3*GX,OY+offset*GY);ctx.lineTo(OX+5*GX,OY+(offset+2)*GY);ctx.moveTo(OX+5*GX,OY+offset*GY);ctx.lineTo(OX+3*GX,OY+(offset+2)*GY);ctx.stroke()}ctx.save();ctx.fillStyle="#7a4223";ctx.font='bold 31px "STKaiti","KaiTi",serif';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(myIndex===1?"汉  界":"楚  河",OX+2*GX,OY+4.5*GY);ctx.fillText(myIndex===1?"楚  河":"汉  界",OX+6*GX,OY+4.5*GY);ctx.restore()}
function drawPiece(piece,x,y){const p=pixel(x,y),red=sideOf(piece)===0,g=ctx.createRadialGradient(p.x-8,p.y-9,3,p.x,p.y,31);g.addColorStop(0,"#fff1c0");g.addColorStop(1,"#d6a35f");ctx.fillStyle="#4b2d19";ctx.beginPath();ctx.arc(p.x+2,p.y+3,31,0,Math.PI*2);ctx.fill();ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,29,0,Math.PI*2);ctx.fill();ctx.strokeStyle=red?"#a52721":"#282521";ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,23,0,Math.PI*2);ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=red?"#ae2923":"#24211e";ctx.font='bold 33px "STKaiti","KaiTi",serif';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(NAMES[piece[0]],p.x,p.y+2)}
function draw(){ctx.clearRect(0,0,760,840);drawBoard();if(!state)return;if(state.lastMove?.from){for(const pos of [state.lastMove.from,state.lastMove.to]){const p=pixel(pos.x,pos.y);ctx.fillStyle="#f5d85b66";ctx.beginPath();ctx.arc(p.x,p.y,35,0,Math.PI*2);ctx.fill()}}if(selected){const p=pixel(selected.x,selected.y);ctx.strokeStyle="#fff078";ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,35,0,Math.PI*2);ctx.stroke();for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(pseudo(state.board,selected.x,selected.y,x,y)){const d=pixel(x,y),safe=legalMove(state.board,myIndex,selected,{x,y});ctx.fillStyle=safe?"#df4f3da8":"#ffb52b99";ctx.beginPath();ctx.arc(d.x,d.y,state.board[y][x]?13:8,0,Math.PI*2);ctx.fill();if(!safe){ctx.strokeStyle="#6e160f";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(d.x-7,d.y-7);ctx.lineTo(d.x+7,d.y+7);ctx.moveTo(d.x+7,d.y-7);ctx.lineTo(d.x-7,d.y+7);ctx.stroke()}}}for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(state.board[y][x]){if(state.check&&state.currentTurn===sideOf(state.board[y][x])&&typeOf(state.board[y][x])==="j"){const p=pixel(x,y);ctx.fillStyle="#f52e2455";ctx.beginPath();ctx.arc(p.x,p.y,42,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ff3328";ctx.lineWidth=5;ctx.stroke()}drawPiece(state.board[y][x],x,y)}if(dangerPoint){const p=pixel(dangerPoint.x,dangerPoint.y);ctx.strokeStyle="#ff3c2f";ctx.lineWidth=6;ctx.beginPath();ctx.arc(p.x,p.y,39,0,Math.PI*2);ctx.stroke()}}
function positionAlert(){ui.boardCard.classList.toggle("in-check",state.status==="PLAYING"&&state.check);const key=`${room.game.round||1}-${state.moveNumber}-${state.status}-${state.check}-${state.winner}`;if(key===lastAlertKey)return;lastAlertKey=key;if(state.status==="FINISHED"&&!state.lastMove?.resign)showChessAlert("mate","将 死",state.winner===myIndex?"绝杀成功，本局获胜":"无路可走，本局落败");else if(state.status==="PLAYING"&&state.check)showChessAlert("check","将 军",state.currentTurn===myIndex?"你的将帅正在被攻击":"对方将帅正在被攻击")}
function updateUI(){if(!room||!state)return;ui.red.classList.toggle("active",state.currentTurn===0&&state.status==="PLAYING");ui.black.classList.toggle("active",state.currentTurn===1&&state.status==="PLAYING");ui.redName.textContent=room.host.username;ui.blackName.textContent=room.guest.username;ui.roomCode.textContent=`房间 ${room.id.slice(-6).toUpperCase()} · 第 ${room.game.round||1} 局 · 你执${myIndex===0?"红":"黑"}`;const turn=state.currentTurn===0?room.host.username:room.guest.username;if(state.status==="FINISHED")ui.status.textContent=state.winner===myIndex?"对局结束：你获胜":"对局结束：对手获胜";else ui.status.textContent=state.currentTurn===myIndex?`轮到你走（${myIndex===0?"红方":"黑方"}）${state.check?" · 将军！":""}`:`等待 ${turn} 走棋${state.check?" · 将军！":""}`;ui.resign.disabled=state.status!=="PLAYING";const m=state.lastMove;if(m?.resign)ui.log.textContent=`${m.player===0?"红方":"黑方"}认输`;else if(m?.from)ui.log.textContent=`第 ${state.moveNumber} 手：${NAMES[m.piece[0]]} (${m.from.x},${m.from.y}) → (${m.to.x},${m.to.y})${m.captured?`，吃${NAMES[m.captured[0]]}`:""}`;else ui.log.textContent="红方先行";draw();positionAlert()}
function boardPoint(event){const rect=canvas.getBoundingClientRect(),px=(event.clientX-rect.left)*760/rect.width,py=(event.clientY-rect.top)*840/rect.height,vx=Math.round((px-OX)/GX),vy=Math.round((py-OY)/GY);if(!inside(vx,vy)||Math.hypot(px-(OX+vx*GX),py-(OY+vy*GY))>35)return null;return fromView(vx,vy)}
canvas.addEventListener("pointerdown",async event=>{event.preventDefault();if(!state||state.status!=="PLAYING"||busy)return;if(state.currentTurn!==myIndex)return toast("还没轮到你");const p=boardPoint(event);if(!p)return;const piece=state.board[p.y][p.x];if(!selected){if(piece&&sideOf(piece)===myIndex){selected=p;dangerPoint=null;draw()}return}if(piece&&sideOf(piece)===myIndex){selected=p;dangerPoint=null;draw();return}if(!pseudo(state.board,selected.x,selected.y,p.x,p.y))return toast("该棋子不能走到这里");if(!legalMove(state.board,myIndex,selected,p)){dangerPoint=p;draw();showChessAlert("warning","即将被将军","这步会暴露将帅，不能落子");clearTimeout(canvas.dangerTimer);canvas.dangerTimer=setTimeout(()=>{dangerPoint=null;draw()},1450);return}busy=true;try{const result=await api(`/api/rooms/${roomId}/action`,{method:"POST",body:JSON.stringify({type:"CHESS_MOVE",from:selected,to:p})});state=result.state;selected=null;dangerPoint=null;updateUI()}catch(error){toast(error.message);selected=null;dangerPoint=null;draw()}finally{busy=false}});
async function sync(){try{const result=await api(`/api/rooms/${roomId}`);if(result.room.mode!=="CHESS"||result.room.status!=="STARTED")throw Error("该房间不是进行中的象棋房间");room=result.room;me=result.me;myIndex=room.host.id===me.id?0:1;state=room.game.chess;updateUI()}catch(error){alert(error.message);location.href="/lobby.html"}}
function acceptRoom(nextRoom){room=nextRoom;state=room.game.chess;selected=null;dangerPoint=null;lastAlertKey="";ui.boardCard.classList.remove("in-check","alert-shake");ui.alert.classList.remove("show");updateUI()}
function connect(){events?.close();events=new EventSource("/api/events");events.onmessage=event=>{const message=JSON.parse(event.data);if(message.roomId&&message.roomId!==roomId)return;if(message.type==="CHESS_STATE"){state=message.state;selected=null;updateUI()}else if(message.type==="REMATCH_STATUS"){room.game.rematchReady=message.rematchReady}else if(message.type==="ROOM_REMATCH")acceptRoom(message.room);else if(message.type==="ROOM_CLOSED"){alert(message.reason||"房间已关闭");location.href="/lobby.html"}};events.onerror=()=>setTimeout(sync,800)}
ui.resign.onclick=async()=>{if(!state||state.status!=="PLAYING"||!confirm("确定认输？"))return;try{const result=await api(`/api/rooms/${roomId}/action`,{method:"POST",body:JSON.stringify({type:"CHESS_RESIGN"})});state=result.state;updateUI()}catch(error){toast(error.message)}};
ui.rematch.onclick=async()=>{try{const result=await api(`/api/rooms/${roomId}/rematch`,{method:"POST"});if(result.started)acceptRoom(result.room);else{room.game.rematchReady=result.rematchReady;toast("已申请重赛，等待对手确认")}}catch(error){toast(error.message)}};
setInterval(()=>{if(!state||!room)return;const over=state.status==="FINISHED",ready=!!room.game.rematchReady?.[myIndex];ui.rematch.hidden=!over;ui.rematch.disabled=ready;ui.rematch.textContent=ready?"等待对手…":"再来一局"},200);
ui.exit.onclick=async()=>{if(!confirm("确定退出房间？进行中的对局将结束。"))return;try{await api(`/api/rooms/${roomId}/exit`,{method:"POST"})}finally{location.href="/lobby.html"}};
if(!roomId){location.href="/lobby.html"}else sync().then(connect);window.addEventListener("resize",draw);
</script>
</body>
</html>
