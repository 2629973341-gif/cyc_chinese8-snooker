<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黑金游戏服务器</title>
<style>
:root{--bg:#09120f;--panel:#111d19;--panel2:#172620;--line:#2b4037;--text:#edf2ef;--muted:#8fa198;--gold:#d4aa5f;--green:#36b978;--red:#ed665b;--blue:#55a7e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 25% 0,#183328 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(420px,100%);padding:28px;border:1px solid var(--line);border-radius:18px;background:#101b17eF;box-shadow:0 30px 80px #0009}.logo{width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--gold);border-radius:50%;font:bold 26px Georgia;color:var(--gold);margin-bottom:15px}.auth h1{margin:0;font:700 28px Georgia,"STSong",serif}.auth p{color:var(--muted);font-size:13px}.tabs{display:flex;gap:5px;margin:20px 0 13px}.tabs button{flex:1}.field{display:grid;gap:6px;margin:11px 0}.field label,.mini{font-size:11px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0d1713;color:var(--text);padding:11px;outline:0}input:focus,select:focus{border-color:var(--gold)}button{border:1px solid var(--line);border-radius:8px;background:#192922;color:var(--text);padding:9px 12px;cursor:pointer}button:hover:not(:disabled){border-color:var(--gold)}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--gold);border-color:var(--gold);color:#111713;font-weight:800}.danger{color:#ff8a80}.wide{width:100%}.error{min-height:19px;color:#ff8a80;font-size:12px}.shell{max-width:1240px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand .logo{width:43px;height:43px;font-size:19px;margin:0}.brand h1{margin:0;font:700 21px Georgia,"STSong",serif}.brand small{color:var(--gold);letter-spacing:1.5px}.me{display:flex;align-items:center;gap:10px}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.card{border:1px solid var(--line);background:#101b17dd;border-radius:14px;padding:17px;min-width:0}.card h2{margin:0 0 13px;font-size:12px;letter-spacing:1.4px;color:var(--gold)}.room-empty{padding:34px 10px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.create{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}.room-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.room-code{font:700 18px ui-monospace,monospace}.tag{font-size:10px;padding:4px 7px;border-radius:12px;background:#26392f;color:#c7d3cc}.tag.game{background:#4b3120;color:#ffd39a}.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.seat{min-height:68px;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}.seat.empty{border-style:dashed;color:var(--muted)}.seat strong{display:block;margin-bottom:6px}.room-actions{display:flex;flex-wrap:wrap;gap:7px}.section-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.list{display:grid;gap:7px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#13211c}.user-main{min-width:0}.user-main strong{display:block;overflow:hidden;text-overflow:ellipsis}.presence{font-size:10px;color:var(--muted)}.presence.online{color:#68d99b}.presence.busy{color:#f1b86b}.item-actions{display:flex;gap:5px;flex-shrink:0}.item-actions button{padding:6px 8px;font-size:11px}.search{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:10px}.notice{margin-bottom:10px;padding:10px;border-left:3px solid var(--gold);background:#1a281f;border-radius:5px;font-size:12px}.muted{text-align:center;padding:15px;color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:25px;translate:-50% 15px;opacity:0;pointer-events:none;background:#07100def;border:1px solid #53675d;border-radius:22px;padding:9px 16px;font-size:12px;transition:.2s}.toast.show{translate:-50% 0;opacity:1}@media(max-width:760px){.shell{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.me{flex-wrap:wrap;justify-content:flex-end}.brand small{display:none}.seats{grid-template-columns:1fr}.create{grid-template-columns:1fr}.card{padding:13px}}
</style>
</head>
<body>
<section id="auth" class="auth"><form id="authForm" class="auth-card"><div class="logo">游</div><h1>黑金游戏服务器</h1><p>登录后添加好友，创建台球或中国象棋双人房间。</p><div class="tabs"><button type="button" data-auth="login" class="primary">登录</button><button type="button" data-auth="register">注册</button></div><div class="field"><label>用户名</label><input id="username" autocomplete="username" maxlength="16" required></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="72" required></div><div id="authError" class="error"></div><button id="authSubmit" class="primary wide">登录</button></form></section>
<main id="app" class="shell hidden"><header class="top"><div class="brand"><div class="logo">游</div><div><small>GAME SERVER / ONLINE</small><h1>黑金游戏服务器</h1></div></div><div class="me"><span class="status-dot"></span><strong id="meName"></strong><button id="logout">退出账号</button></div></header><div class="grid"><div><section class="card"><h2>1V1 房间</h2><div id="room"></div></section><section class="card" style="margin-top:18px"><div class="section-row"><h2 style="margin:0">好友</h2><span id="friendCount" class="mini"></span></div><div id="friends" class="list"></div></section></div><div><section class="card"><h2>通知</h2><div id="notices"></div></section><section class="card" style="margin-top:18px"><h2>查找玩家</h2><div class="search"><input id="searchInput" placeholder="输入用户名"><button id="searchButton">搜索</button></div><div id="searchResults" class="list"></div></section></div></div></main><div id="toast" class="toast"></div>
<style>.leaderboard-card select{width:auto;min-width:120px;padding:6px 9px}.leaderboard{display:grid;gap:5px}.rank-row{display:grid;grid-template-columns:42px minmax(80px,1fr) 90px 48px;align-items:center;gap:6px;padding:8px;border-radius:7px;background:#13211c;color:var(--muted);font-size:12px}.rank-row strong{color:var(--text);overflow:hidden;text-overflow:ellipsis}.rank-row.mine{outline:1px solid var(--gold);background:#22291d}.rank-head{background:transparent;padding-top:0;font-size:10px}.rank-head span:nth-child(n+3),.rank-row span:nth-child(n+3){text-align:right}@media(max-width:420px){.rank-row{grid-template-columns:36px minmax(70px,1fr) 84px 42px;padding:7px 5px}}</style>
<script>
"use strict";
const $=s=>document.querySelector(s),auth=$("#auth"),app=$("#app"),authForm=$("#authForm"),authError=$("#authError"),authSubmit=$("#authSubmit"),roomEl=$("#room"),friendsEl=$("#friends"),noticesEl=$("#notices"),resultsEl=$("#searchResults");let authMode="login",data=null,events=null,refreshTimer=null;
function addBoardModes(){for(const select of [$("#createMode"),$("#roomMode")]){if(!select)continue;for(const[value,label]of[["FIVE","五子棋"],["GO","围棋"]])if(!select.querySelector(`option[value="${value}"]`))select.add(new Option(label,value));if(select.id==="roomMode"&&data?.rooms?.[0])select.value=data.rooms[0].mode}}
new MutationObserver(addBoardModes).observe(roomEl,{childList:true,subtree:true});
const leaderboardCard=document.createElement("section");leaderboardCard.className="card leaderboard-card";leaderboardCard.style.marginTop="18px";leaderboardCard.innerHTML='<div class="section-row"><h2 style="margin:0">排行榜</h2><select id="leaderboardMode" aria-label="排行榜游戏"><option value="EIGHT">中式八球</option><option value="SNOOKER">斯诺克</option><option value="CHESS">中国象棋</option><option value="FIVE">五子棋</option><option value="GO">围棋</option></select></div><div id="leaderboard" class="leaderboard"><div class="muted">正在加载…</div></div>';document.querySelector(".grid>div:last-child").appendChild(leaderboardCard);const leaderboardMode=$("#leaderboardMode"),leaderboard=$("#leaderboard");leaderboardMode.onchange=()=>loadLeaderboard();
async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.error||"请求失败");return payload}
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1800)}
function statusText(status){if(status&4)return"游戏中";if(status&2)return"房间中";if(status&1)return"在线";return"离线"}function statusClass(status){return status&6?"busy":status&1?"online":""}function modeText(mode){return mode==="SNOOKER"?"斯诺克":mode==="CHESS"?"中国象棋":mode==="FIVE"?"五子棋":mode==="GO"?"围棋":"中式八球"}function gameUrl(room){const pages={CHESS:"/chess.html",FIVE:"/five.html",GO:"/go.html"};return`${pages[room.mode]||"/billiards.html"}?room=${room.id}`}function escapeHtml(value){const node=document.createElement("div");node.textContent=value;return node.innerHTML}
function connectEvents(){events?.close();events=new EventSource("/api/events");events.onmessage=event=>{const message=JSON.parse(event.data);if(message.type==="ROOM_STARTED"&&message.room){location.href=gameUrl(message.room);return}if(message.type==="ROOM_CLOSED")toast(message.reason||"房间已关闭");clearTimeout(refreshTimer);refreshTimer=setTimeout(load,100)}}
async function load(){try{data=await api("/api/bootstrap");auth.classList.add("hidden");app.classList.remove("hidden");$("#meName").textContent=data.me.username;render();if(!events)connectEvents()}catch(error){if(error.message.includes("登录")){auth.classList.remove("hidden");app.classList.add("hidden");events?.close();events=null}else toast(error.message)}}
function render(){renderRoom();renderFriends();renderNotices();loadLeaderboard()}
async function loadLeaderboard(){try{const result=await api(`/api/leaderboard?mode=${encodeURIComponent(leaderboardMode.value)}`);leaderboard.innerHTML=result.ranking.length?`<div class="rank-row rank-head"><span>名次</span><span>玩家</span><span>胜 / 负</span><span>胜率</span></div>${result.ranking.map(item=>`<div class="rank-row ${data?.me?.id===item.id?"mine":""}"><b>${item.rank}</b><strong>${escapeHtml(item.username)}</strong><span>${item.wins} / ${item.losses}${item.draws?` / ${item.draws}和`:""}</span><span>${item.winRate}%</span></div>`).join("")}`:'<div class="muted">暂无对局记录</div>'}catch(error){leaderboard.innerHTML=`<div class="muted">${escapeHtml(error.message)}</div>`}}
function renderRoom(){const active=data.rooms[0];if(!active){roomEl.innerHTML=`<div class="room-empty">当前没有房间<br><span class="mini">创建后可邀请一名在线且空闲的好友</span></div><div class="create"><select id="createMode"><option value="EIGHT">中式八球</option><option value="SNOOKER">斯诺克</option><option value="CHESS">中国象棋</option></select><button id="createRoom" class="primary">创建房间</button></div>`;$("#createRoom").onclick=()=>act(async()=>{await api("/api/rooms",{method:"POST",body:JSON.stringify({mode:$("#createMode").value})});await load()},"房间已创建");return}const host=active.host.id===data.me.id,isStarted=active.status==="STARTED";roomEl.innerHTML=`<div class="room-head"><div><div class="room-code">${active.id.slice(-8).toUpperCase()}</div><span class="mini">房间号</span></div><span class="tag ${isStarted?"game":""}">${isStarted?"游戏中":"等待玩家"}</span></div><div class="field"><label>游戏模式${active.modeLocked?"（已锁定）":""}</label><select id="roomMode" ${!host||active.modeLocked?"disabled":""}><option value="EIGHT" ${active.mode==="EIGHT"?"selected":""}>中式八球</option><option value="SNOOKER" ${active.mode==="SNOOKER"?"selected":""}>斯诺克</option><option value="CHESS" ${active.mode==="CHESS"?"selected":""}>中国象棋</option></select></div><div class="seats"><div class="seat"><strong>${escapeHtml(active.host.username)}</strong><span class="presence ${statusClass(active.host.status)}">房主 · ${statusText(active.host.status)}</span></div><div class="seat ${active.guest?"":"empty"}"><strong>${active.guest?escapeHtml(active.guest.username):"等待加入"}</strong><span class="presence ${active.guest?statusClass(active.guest.status):""}">${active.guest?statusText(active.guest.status):"邀请一位好友"}</span></div></div><div class="room-actions">${host&&!active.guest&&!isStarted?`<button id="inviteHint">从好友列表邀请</button>`:""}${host&&active.guest&&!isStarted?`<button id="startRoom" class="primary">开始游戏</button>`:""}${isStarted?`<button id="enterRoom" class="primary">进入对局</button>`:""}<button id="exitRoom" class="danger">退出房间</button></div>`;const mode=$("#roomMode");if(mode&&!mode.disabled)mode.onchange=()=>act(async()=>{await api(`/api/rooms/${active.id}/mode`,{method:"PATCH",body:JSON.stringify({mode:mode.value})});await load()},"模式已更新");if($("#startRoom"))$("#startRoom").onclick=()=>act(async()=>{const result=await api(`/api/rooms/${active.id}/start`,{method:"POST"});location.href=gameUrl(result.room)});if($("#enterRoom"))$("#enterRoom").onclick=()=>location.href=gameUrl(active);$("#exitRoom").onclick=()=>act(async()=>{await api(`/api/rooms/${active.id}/exit`,{method:"POST"});await load()},"已退出房间")}
function renderFriends(){$("#friendCount").textContent=`${data.friends.length} 位`;const room=data.rooms[0],canInvite=room&&room.host.id===data.me.id&&!room.guest&&room.status==="WAITING";friendsEl.innerHTML=data.friends.length?data.friends.map(friend=>`<div class="item"><div class="user-main"><strong>${escapeHtml(friend.username)}</strong><span class="presence ${statusClass(friend.status)}">${statusText(friend.status)}</span></div><div class="item-actions">${canInvite?`<button data-invite="${friend.id}" ${(friend.status&1)&&!(friend.status&6)?"":"disabled"}>邀请</button>`:""}</div></div>`).join(""):`<div class="muted">还没有好友</div>`;friendsEl.querySelectorAll("[data-invite]").forEach(button=>button.onclick=()=>act(async()=>{await api(`/api/rooms/${room.id}/invite`,{method:"POST",body:JSON.stringify({userId:button.dataset.invite})})},"邀请已发送"))}
function renderNotices(){const blocks=[];for(const request of data.incoming)blocks.push(`<div class="notice"><strong>${escapeHtml(request.fromUser.username)}</strong> 请求添加你为好友<div class="item-actions" style="margin-top:7px"><button data-friend="${request.id}" data-accept="1" class="primary">接受</button><button data-friend="${request.id}" data-accept="0">拒绝</button></div></div>`);for(const room of data.roomInvites)blocks.push(`<div class="notice"><strong>${escapeHtml(room.host.username)}</strong> 邀请你进行${modeText(room.mode)}<div class="item-actions" style="margin-top:7px"><button data-room-invite="${room.id}" data-accept="1" class="primary">加入</button><button data-room-invite="${room.id}" data-accept="0">拒绝</button></div></div>`);noticesEl.innerHTML=blocks.join("")||'<div class="muted">暂无新通知</div>';noticesEl.querySelectorAll("[data-friend]").forEach(button=>button.onclick=()=>act(async()=>{await api(`/api/friends/${button.dataset.friend}/respond`,{method:"POST",body:JSON.stringify({accept:button.dataset.accept==="1"})});await load()}));noticesEl.querySelectorAll("[data-room-invite]").forEach(button=>button.onclick=()=>act(async()=>{await api(`/api/rooms/${button.dataset.roomInvite}/invite-response`,{method:"POST",body:JSON.stringify({accept:button.dataset.accept==="1"})});await load()}))}
async function act(task,success){try{await task();if(success)toast(success)}catch(error){toast(error.message);await load()}}
document.querySelectorAll("[data-auth]").forEach(button=>button.onclick=()=>{authMode=button.dataset.auth;document.querySelectorAll("[data-auth]").forEach(x=>x.classList.toggle("primary",x===button));authSubmit.textContent=authMode==="login"?"登录":"创建账号";authError.textContent=""});authForm.onsubmit=async event=>{event.preventDefault();authError.textContent="";try{await api(`/api/auth/${authMode}`,{method:"POST",body:JSON.stringify({username:$("#username").value,password:$("#password").value})});await load()}catch(error){authError.textContent=error.message}};
$("#logout").onclick=()=>act(async()=>{await api("/api/auth/logout",{method:"POST"});location.reload()});$("#searchButton").onclick=async()=>{try{const result=await api(`/api/users?q=${encodeURIComponent($("#searchInput").value)}`);resultsEl.innerHTML=result.users.length?result.users.map(user=>`<div class="item"><div class="user-main"><strong>${escapeHtml(user.username)}</strong><span class="presence ${statusClass(user.status)}">${statusText(user.status)}</span></div><button data-add="${user.id}" ${data.friends.some(f=>f.id===user.id)?"disabled":""}>${data.friends.some(f=>f.id===user.id)?"已是好友":"添加"}</button></div>`).join(""):'<div class="muted">没有找到玩家</div>';resultsEl.querySelectorAll("[data-add]").forEach(button=>button.onclick=()=>act(async()=>{await api("/api/friends/request",{method:"POST",body:JSON.stringify({userId:button.dataset.add})});button.disabled=true},"申请已发送"))}catch(error){toast(error.message)}};$("#searchInput").addEventListener("keydown",event=>{if(event.key==="Enter")$("#searchButton").click()});load();
</script>
</body></html>
