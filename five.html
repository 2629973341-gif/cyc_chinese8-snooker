<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>在线五子棋</title>
<style>
:root{--bg:#0b1210;--panel:#14201c;--line:#31443c;--gold:#d9b56c;--text:#f2f3ef;--muted:#9aa9a1;--wood:#d7a85e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1d382c,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif}.app{max-width:1120px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:22px;color:var(--gold)}button{font:inherit;color:var(--text);background:#1c2b25;border:1px solid var(--line);border-radius:8px;padding:9px 13px}.layout{display:grid;grid-template-columns:minmax(0,760px) 280px;gap:18px}.board-wrap{background:#101916;border:1px solid var(--line);border-radius:14px;padding:12px}.board{display:block;width:100%;aspect-ratio:1;background:var(--wood);border-radius:7px;touch-action:none}.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.players{display:grid;gap:9px}.player{display:flex;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:9px;color:var(--muted)}.player.active{border-color:var(--gold);color:var(--text);box-shadow:inset 3px 0 var(--gold)}.stone{display:inline-block;width:15px;height:15px;border-radius:50%;vertical-align:-2px;margin-right:7px;background:#111;border:1px solid #555}.stone.white{background:#fafafa;border-color:#bbb}.status{margin:15px 0;padding:13px;min-height:58px;line-height:1.65;background:#0d1713;border-radius:9px;color:#dbe3de}.meta{font-size:12px;color:var(--muted);line-height:1.8}.actions{display:grid;gap:8px;margin-top:18px}.danger{color:#ff9b91}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#050a08eF;border:1px solid var(--line);padding:9px 15px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:800px){.app{padding:8px}.layout{grid-template-columns:1fr}.side{padding:12px}.players{grid-template-columns:1fr 1fr}.top h1{font-size:18px}}@media(orientation:landscape) and (max-height:600px){.app{max-width:100vw}.layout{grid-template-columns:minmax(0,calc(100vh - 72px)) 1fr}.side{overflow:auto;max-height:calc(100vh - 70px)}}
</style></head><body><main class="app"><header class="top"><h1>在线五子棋 · 1V1</h1><button id="back">返回大厅</button></header><div class="layout"><section class="board-wrap"><canvas id="board" class="board" width="760" height="760"></canvas></section><aside class="side"><div class="players"><div id="black" class="player"><span><i class="stone"></i><b id="blackName">黑方</b></span><span>先手</span></div><div id="white" class="player"><span><i class="stone white"></i><b id="whiteName">白方</b></span><span>后手</span></div></div><div id="status" class="status">正在连接房间…</div><div class="meta"><div id="roomCode"></div><div id="moveInfo">黑方先行，横、竖或斜线连续五子获胜。</div></div><div class="actions"><button id="resign" class="danger">认输</button><button id="exit" class="danger">退出房间</button></div></aside></div></main><div id="toast" class="toast"></div>
<style>@media(pointer:coarse){.app{width:100%;max-width:540px;padding:6px 7px 18px}.top{margin-bottom:7px}.layout{display:flex;flex-direction:column;gap:8px}.board-wrap{width:100%;padding:4px;border-radius:9px}.side{max-height:none;overflow:visible;padding:9px}.status{min-height:48px;margin:9px 0;padding:9px}.actions{grid-template-columns:1fr 1fr;margin-top:10px}.players{grid-template-columns:1fr 1fr}.player{padding:8px;font-size:12px}}</style>
<script src="/game-audio.js"></script>
<script>
"use strict";
const canvas=document.querySelector("#board"),ctx=canvas.getContext("2d"),ui={black:document.querySelector("#black"),white:document.querySelector("#white"),blackName:document.querySelector("#blackName"),whiteName:document.querySelector("#whiteName"),status:document.querySelector("#status"),roomCode:document.querySelector("#roomCode"),moveInfo:document.querySelector("#moveInfo"),resign:document.querySelector("#resign"),exit:document.querySelector("#exit"),back:document.querySelector("#back")};
ui.rematch=document.createElement("button");ui.rematch.textContent="再来一局";ui.rematch.hidden=true;ui.resign.parentElement.prepend(ui.rematch);
const roomId=new URLSearchParams(location.search).get("room");let room=null,me=null,state=null,myIndex=-1,busy=false,events=null,aiTimer=null,aiFailures=0,placeAnim=null,drawFrame=0;const SIZE=760,M=42;
async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||"请求失败");return data}
function toast(message){const el=document.querySelector("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1800)}
function draw(){cancelAnimationFrame(drawFrame);if(!state)return;const n=state.size,cell=(SIZE-M*2)/(n-1),g=ctx.createLinearGradient(0,0,SIZE,SIZE);g.addColorStop(0,"#e4ba78");g.addColorStop(1,"#c78e43");ctx.fillStyle=g;ctx.fillRect(0,0,SIZE,SIZE);ctx.strokeStyle="#765028";ctx.lineWidth=2;for(let i=0;i<n;i++){const p=M+i*cell;ctx.beginPath();ctx.moveTo(M,p);ctx.lineTo(SIZE-M,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,M);ctx.lineTo(p,SIZE-M);ctx.stroke()}for(const[x,y]of[[3,3],[11,3],[7,7],[3,11],[11,11]]){ctx.fillStyle="#5a3a20";ctx.beginPath();ctx.arc(M+x*cell,M+y*cell,5,0,Math.PI*2);ctx.fill()}let animating=false;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const value=state.board[y][x];if(!value)continue;const px=M+x*cell,py=M+y*cell,r=cell*.39,active=placeAnim&&placeAnim.x===x&&placeAnim.y===y,t=active?Math.min(1,(performance.now()-placeAnim.start)/210):1,scale=active?1-Math.pow(1-t,3)+Math.sin(Math.PI*t)*.14:1;ctx.save();ctx.translate(px,py);ctx.scale(scale,scale);ctx.shadowColor=active?"#000a":"#0005";ctx.shadowBlur=active?15:5;ctx.shadowOffsetY=active?8:3;const grad=ctx.createRadialGradient(-r*.35,-r*.4,2,0,0,r);grad.addColorStop(0,value===1?"#69706f":"#fff");grad.addColorStop(1,value===1?"#080b0a":"#c9cecc");ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.shadowColor="transparent";ctx.strokeStyle=value===1?"#050706":"#aeb5b2";ctx.stroke();ctx.restore();if(active&&t<1)animating=true}if(state.lastMove?.x>=0){ctx.strokeStyle="#ef594f";ctx.lineWidth=3;ctx.beginPath();ctx.arc(M+state.lastMove.x*cell,M+state.lastMove.y*cell,cell*.14,0,Math.PI*2);ctx.stroke()}if(animating)drawFrame=requestAnimationFrame(draw);else placeAnim=null}
function applyFiveState(next){const finished=state?.status==="PLAYING"&&next?.status==="FINISHED";if(state&&next?.lastMove?.x>=0&&next.moveNumber!==state.moveNumber){placeAnim={x:next.lastMove.x,y:next.lastMove.y,start:performance.now()};gameAudio.play("place",.9)}state=next;if(finished)gameAudio.play("win");update()}
function canControl(){return room?.playType==="PRACTICE"||state?.currentTurn===myIndex}
const FIVE_DIRS=[[1,0],[0,1],[1,1],[1,-1]];
function fiveCandidates(board){const result=[];let occupied=0;for(let y=0;y<board.length;y++)for(let x=0;x<board.length;x++)if(board[y][x])occupied++;if(!occupied)return[{x:7,y:7}];for(let y=0;y<board.length;y++)for(let x=0;x<board.length;x++){if(board[y][x])continue;let near=false;for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++)if(board[y+dy]?.[x+dx]){near=true;break}if(near)result.push({x,y})}return result}
function fiveLine(board,x,y,color,dx,dy){let count=1,open=0;for(const sign of[-1,1]){let step=1;while(board[y+dy*step*sign]?.[x+dx*step*sign]===color){count++;step++}if(board[y+dy*step*sign]?.[x+dx*step*sign]===0)open++}return{count,open}}
function fivePatternValue(count,open){if(count>=5)return 1e8;if(count===4)return open===2?2600000:open===1?420000:0;if(count===3)return open===2?90000:open===1?9000:0;if(count===2)return open===2?3200:open===1?360:0;return open===2?45:8}
function fiveTacticalScore(board,x,y,color){if(board[y][x])return-Infinity;let score=0,strongThreats=0;for(const[dx,dy]of FIVE_DIRS){const line=fiveLine(board,x,y,color,dx,dy);score+=fivePatternValue(line.count,line.open);if(line.count>=4&&line.open>0||line.count===3&&line.open===2)strongThreats++}if(strongThreats>=2)score+=1500000;return score}
function fiveWinsAt(board,x,y,color){return FIVE_DIRS.some(([dx,dy])=>fiveLine(board,x,y,color,dx,dy).count>=5)}
function chooseFiveAiMove(){const board=state.board,candidates=fiveCandidates(board),center=(state.size-1)/2;for(const p of candidates)if(fiveWinsAt(board,p.x,p.y,2))return p;const mustBlock=candidates.filter(p=>fiveWinsAt(board,p.x,p.y,1)),pool=mustBlock.length?mustBlock:candidates,ranked=pool.map(p=>({...p,base:fiveTacticalScore(board,p.x,p.y,2)+fiveTacticalScore(board,p.x,p.y,1)*1.08-Math.hypot(p.x-center,p.y-center)*2})).sort((a,b)=>b.base-a.base);if(mustBlock.length)return ranked[0];let best=ranked[0]||{x:7,y:7,base:0},bestValue=-Infinity;for(const move of ranked.slice(0,16)){board[move.y][move.x]=2;const replies=fiveCandidates(board).map(p=>({...p,score:fiveTacticalScore(board,p.x,p.y,1)+fiveTacticalScore(board,p.x,p.y,2)*.42})).sort((a,b)=>b.score-a.score).slice(0,14);let danger=0;for(const reply of replies){if(fiveWinsAt(board,reply.x,reply.y,1)){danger=5e7;break}danger=Math.max(danger,reply.score)}board[move.y][move.x]=0;const value=move.base-danger*.92+Math.random()*3;if(value>bestValue){bestValue=value;best=move}}return{x:best.x,y:best.y}}
function maybeFiveAI(){if(room?.playType!=="AI"||state?.status!=="PLAYING"||state.currentTurn!==1||busy||aiTimer)return;aiTimer=setTimeout(async()=>{aiTimer=null;if(state?.currentTurn!==1)return;const p=chooseFiveAiMove();busy=true;try{const result=await api(`/api/rooms/${roomId}/board-action`,{method:"POST",body:JSON.stringify({type:"FIVE_MOVE",...p})});aiFailures=0;applyFiveState(result.state)}catch(error){aiFailures++;if(aiFailures===1)toast(`${error.message}，电脑将自动重试`);if(aiFailures%3===0)try{const latest=await api(`/api/rooms/${roomId}`);room=latest.room;state=room.game.five}catch{}}finally{busy=false;if(room?.playType==="AI"&&state?.status==="PLAYING"&&state.currentTurn===1)setTimeout(maybeFiveAI,Math.min(2500,650+aiFailures*300))}},420)}
function update(){if(!room||!state)return;ui.blackName.textContent=room.host.username;ui.whiteName.textContent=room.guest.username;ui.black.classList.toggle("active",state.status==="PLAYING"&&state.currentTurn===0);ui.white.classList.toggle("active",state.status==="PLAYING"&&state.currentTurn===1);ui.roomCode.textContent=`房间 ${room.id.slice(-6).toUpperCase()} · ${room.playType==="PRACTICE"?"练习模式":room.playType==="AI"?"对战电脑":`你执${myIndex===0?"黑":"白"}`}`;if(state.status==="FINISHED")ui.status.textContent=state.winner===-1?"棋盘已满，本局和棋":state.winner===myIndex?"对局结束：你获胜":"对局结束：对手获胜";else ui.status.textContent=canControl()?`轮到${state.currentTurn===0?"黑方":"白方"}落子`:"等待电脑落子";ui.moveInfo.textContent=state.lastMove?.resign?`${state.lastMove.player===0?"黑方":"白方"}认输`:`第 ${state.moveNumber} 手 · ${state.lastMove?`${String.fromCharCode(65+state.lastMove.x)}${state.lastMove.y+1}`:"黑方先行"}`;ui.resign.disabled=state.status!=="PLAYING";draw();maybeFiveAI()}
function point(event){const rect=canvas.getBoundingClientRect(),sx=(event.clientX-rect.left)*SIZE/rect.width,sy=(event.clientY-rect.top)*SIZE/rect.height,cell=(SIZE-M*2)/(state.size-1),x=Math.round((sx-M)/cell),y=Math.round((sy-M)/cell);return x>=0&&y>=0&&x<state.size&&y<state.size&&Math.hypot(sx-(M+x*cell),sy-(M+y*cell))<cell*.48?{x,y}:null}
canvas.addEventListener("pointerdown",async event=>{event.preventDefault();if(!state||state.status!=="PLAYING"||busy)return;if(!canControl()||room.playType==="AI"&&state.currentTurn===1)return toast("正在等待电脑");const p=point(event);if(!p)return;busy=true;try{const result=await api(`/api/rooms/${roomId}/board-action`,{method:"POST",body:JSON.stringify({type:"FIVE_MOVE",...p})});applyFiveState(result.state)}catch(error){toast(error.message)}finally{busy=false}});
async function sync(){const result=await api(`/api/rooms/${roomId}`);if(result.room.mode!=="FIVE"||result.room.status!=="STARTED")throw Error("该房间不是进行中的五子棋房间");room=result.room;me=result.me;myIndex=room.host.id===me.id?0:1;state=room.game.five;update();maybePromptRestart(room.game.restartRequest)}
function acceptRoom(nextRoom){clearTimeout(aiTimer);cancelAnimationFrame(drawFrame);aiTimer=null;aiFailures=0;busy=false;placeAnim=null;room=nextRoom;state=room.game.five;lastRestartPrompt="";update()}
let lastRestartPrompt="";async function maybePromptRestart(request){if(!request||request.to!==myIndex||request.id===lastRestartPrompt)return;lastRestartPrompt=request.id;room.game.restartRequest=request;const requester=request.from===0?room.host.username:room.guest.username,accepted=confirm(`${requester} 请求重新开始当前未结束的对局。\n\n确定：放弃当前局并开新局\n取消：继续当前局`);try{const result=await api(`/api/rooms/${roomId}/rematch`,{method:"POST",body:JSON.stringify({round:request.round,requestId:request.id,response:accepted?"ACCEPT":"DECLINE"})});room.game.restartRequest=null;if(result.started)acceptRoom(result.room);else toast("已取消重新开始，继续当前对局")}catch(error){toast(error.message)}}
function connect(){events=new EventSource("/api/events");events.onmessage=event=>{const message=JSON.parse(event.data);if(message.roomId&&message.roomId!==roomId)return;if(message.type==="FIVE_STATE")applyFiveState(message.state);else if(message.type==="RESTART_REQUEST")maybePromptRestart(message.request);else if(message.type==="RESTART_DECLINED"){room.game.restartRequest=null;toast("对手取消了重新开始")}else if(message.type==="ROOM_REMATCH")acceptRoom(message.room);else if(message.type==="ROOM_CLOSED"){alert(message.reason||"房间已关闭");location.href="/lobby.html"}};events.onerror=()=>setTimeout(()=>sync().catch(()=>{}),800)}
ui.resign.onclick=async()=>{if(!state||state.status!=="PLAYING"||!confirm("确定认输？"))return;try{const result=await api(`/api/rooms/${roomId}/board-action`,{method:"POST",body:JSON.stringify({type:"FIVE_RESIGN"})});state=result.state;update()}catch(error){toast(error.message)}};ui.exit.onclick=async()=>{if(!confirm("确定退出房间？进行中的对局将结束。"))return;try{await api(`/api/rooms/${roomId}/exit`,{method:"POST"})}finally{location.href="/lobby.html"}};ui.back.onclick=()=>location.href="/lobby.html";
ui.rematch.onclick=async()=>{try{const result=await api(`/api/rooms/${roomId}/rematch`,{method:"POST",body:JSON.stringify({round:room.game.round})});if(result.started)acceptRoom(result.room);else{room.game.restartRequest=result.pending;toast("已请求重新开始，等待对手确认")}}catch(error){toast(error.message)}};setInterval(()=>{if(!state||!room)return;const over=state.status==="FINISHED",pending=room.game.restartRequest?.from===myIndex;ui.rematch.hidden=false;ui.rematch.disabled=!!pending;ui.rematch.textContent=over?"开始新一局":pending?"等待对手确认…":"重新开始"},200);setInterval(maybeFiveAI,1200);
if(!roomId)location.href="/lobby.html";else sync().then(connect).catch(error=>{alert(error.message);location.href="/lobby.html"});
</script></body></html>
