<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>木石 · 围棋</title>
  <style>
    :root{--ink:#1f2926;--muted:#77817e;--paper:#f4f1e9;--panel:#fffdf8;--wood:#d8a85f;--accent:#315f55}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif}
    .app{max-width:1200px;margin:auto;padding:26px}.header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #dcd8cc;padding-bottom:18px;margin-bottom:22px}.brand{display:flex;gap:13px;align-items:center}.seal{width:43px;height:43px;display:grid;place-items:center;border-radius:8px;background:#a34836;color:#fff;font:700 23px serif}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}.brand h1{margin:1px 0 0;font:700 25px Georgia,"STSong",serif}.subtitle{font-size:12px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:minmax(480px,1fr) 280px;gap:24px}.board-card{background:#25342f;border-radius:14px;padding:18px;box-shadow:0 18px 40px #2838301f}.canvas-wrap{position:relative;margin:auto;max-width:760px}.board{display:block;width:100%;aspect-ratio:1;border-radius:5px;background:var(--wood);cursor:crosshair}.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:8px 14px;border-radius:18px;background:#18231fdb;color:#fff;font-size:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}
    .side{border-left:1px solid #dcd8cc;padding-left:23px}.panel{border-bottom:1px solid #dcd8cc;padding-bottom:19px;margin-bottom:19px}.panel h2{font-size:11px;letter-spacing:1.7px;margin:0 0 14px}.turn{display:flex;align-items:center;justify-content:space-between;padding:13px;background:var(--panel);border:1px solid #e3ded2;border-radius:8px}.stone{width:25px;height:25px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px;box-shadow:inset -4px -4px 6px #0005,0 2px 4px #0003;background:#171918}.stone.white{background:#f5f3ed;box-shadow:inset -3px -3px 5px #aaa,0 2px 4px #0003}.turn-name{font-weight:800}.turn small{color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.stat{background:var(--panel);border:1px solid #e3ded2;border-radius:8px;padding:10px;font-size:12px;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:19px;margin-top:2px}
    label{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:10px 0}select{border:1px solid #d8d2c5;border-radius:6px;background:#fff;padding:7px 9px;color:var(--ink)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buttons button{border:1px solid #d8d2c5;border-radius:6px;background:#fff;padding:9px;color:var(--ink);cursor:pointer}.buttons button:hover{border-color:var(--accent);color:var(--accent)}.buttons .primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}.log{height:145px;overflow:auto;background:#ece9df;border-radius:7px;padding:8px 10px;font-size:11px;color:var(--muted)}.log p{margin:4px 0}.rules{font-size:11px;line-height:1.7;color:var(--muted)}.result{font-weight:800;color:#a34836}
    @media(max-width:820px){.app{padding:14px}.header{align-items:start;flex-direction:column;gap:10px}.layout{display:block}.board-card{padding:9px}.side{border:0;padding:20px 0 0}.panel.settings,.panel.actions{display:inline-block;width:49%;vertical-align:top;padding-right:8px}}
  </style>
</head>
<body>
<main class="app">
  <header class="header"><div class="brand"><div class="seal">弈</div><div><div class="eyebrow">WOOD & STONE / 01</div><h1>木石围棋</h1></div></div><div class="subtitle">本地双人 · 提子 · 禁入点 · 全局同形禁着</div></header>
  <div class="layout">
    <section class="board-card"><div class="canvas-wrap"><canvas id="board" class="board" width="800" height="800"></canvas><div id="toast" class="toast"></div></div></section>
    <aside class="side">
      <section class="panel"><h2>当前手番</h2><div class="turn"><div><span id="turnStone" class="stone"></span><span id="turnName" class="turn-name">黑方</span></div><small id="moveNo">第 1 手</small></div><div class="stats"><div class="stat">黑方提子<b id="blackCaps">0</b></div><div class="stat">白方提子<b id="whiteCaps">0</b></div></div></section>
      <section class="panel settings"><h2>棋局设置</h2><label>棋盘大小<select id="size"><option value="9">9 × 9</option><option value="13">13 × 13</option><option value="19" selected>19 × 19</option></select></label><label>白方贴目<select id="komi"><option value="0">0 目</option><option value="5.5">5.5 目</option><option value="6.5" selected>6.5 目</option><option value="7.5">7.5 目</option></select></label></section>
      <section class="panel actions"><h2>对局操作</h2><div class="buttons"><button id="pass">虚手</button><button id="undo">悔棋</button><button id="score">结束并数子</button><button id="restart" class="primary">重新开始</button></div></section>
      <section class="panel"><h2>棋局记录</h2><div id="log" class="log"></div></section>
      <p class="rules">连续两次虚手会自动终局。基础数子采用面积法：盘上棋子与被单方完全包围的空点计入该方；白方另加贴目。</p>
    </aside>
  </div>
</main>
<script>
"use strict";
const canvas=document.querySelector("#board"),ctx=canvas.getContext("2d");
const sizeSelect=document.querySelector("#size"),komiSelect=document.querySelector("#komi"),restartButton=document.querySelector("#restart"),undoButton=document.querySelector("#undo"),passButton=document.querySelector("#pass"),scoreButton=document.querySelector("#score"),turnNameEl=document.querySelector("#turnName"),turnStoneEl=document.querySelector("#turnStone"),moveNoEl=document.querySelector("#moveNo"),blackCapsEl=document.querySelector("#blackCaps"),whiteCapsEl=document.querySelector("#whiteCaps"),toastEl=document.querySelector("#toast"),logEl=document.querySelector("#log");
const EMPTY=0,BLACK=1,WHITE=2,NAMES={1:"黑方",2:"白方"};
let game=null;

class GoGame{
  constructor(size=19,komi=6.5){this.reset(size,komi)}
  reset(size,komi){
    this.size=size;this.komi=komi;this.board=Array.from({length:size},()=>Array(size).fill(EMPTY));
    this.turn=BLACK;this.move=1;this.captures={[BLACK]:0,[WHITE]:0};this.passCount=0;this.finished=false;
    this.history=[];this.positionHistory=new Set([this.hash(this.board)]);this.logs=[];
    this.saveSnapshot();this.addLog(`开始 ${size}×${size} 对局，黑方先行`);if(game===this)this.updateUI();
  }
  hash(board){return board.map(row=>row.join("")).join("/")}
  cloneBoard(board=this.board){return board.map(row=>row.slice())}
  neighbors(x,y){return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&b>=0&&a<this.size&&b<this.size)}
  /* 从一个棋子出发，搜索整块棋链及其所有气。链没有气时才能整体提走。 */
  groupAt(board,x,y){
    const color=board[y][x],stack=[[x,y]],seen=new Set(),stones=[],liberties=new Set();
    while(stack.length){const [cx,cy]=stack.pop(),key=`${cx},${cy}`;if(seen.has(key))continue;seen.add(key);stones.push([cx,cy]);
      for(const [nx,ny] of this.neighbors(cx,cy)){if(board[ny][nx]===EMPTY)liberties.add(`${nx},${ny}`);else if(board[ny][nx]===color&&!seen.has(`${nx},${ny}`))stack.push([nx,ny])}}
    return{stones,liberties};
  }
  tryMove(x,y){
    if(this.finished||this.board[y][x]!==EMPTY)return{ok:false,reason:this.finished?"棋局已经结束":"该交叉点已有棋子"};
    const next=this.cloneBoard(),enemy=this.turn===BLACK?WHITE:BLACK;next[y][x]=this.turn;let captured=0;
    for(const [nx,ny] of this.neighbors(x,y)){if(next[ny][nx]!==enemy)continue;const group=this.groupAt(next,nx,ny);if(group.liberties.size===0){for(const [gx,gy] of group.stones)next[gy][gx]=EMPTY;captured+=group.stones.length}}
    if(this.groupAt(next,x,y).liberties.size===0)return{ok:false,reason:"禁入点：落子后己方棋块无气"};
    const hash=this.hash(next);if(this.positionHistory.has(hash))return{ok:false,reason:"打劫：不能立即或重复还原旧局面"};
    return{ok:true,next,captured,hash};
  }
  play(x,y){
    const result=this.tryMove(x,y);if(!result.ok){notify(result.reason);return}
    this.board=result.next;this.captures[this.turn]+=result.captured;this.positionHistory.add(result.hash);this.passCount=0;
    this.addLog(`${NAMES[this.turn]} 落子 ${coordName(x,y)}${result.captured?`，提 ${result.captured} 子`:""}`);
    this.turn=this.turn===BLACK?WHITE:BLACK;this.move++;this.saveSnapshot();this.updateUI();
  }
  pass(){if(this.finished)return;this.addLog(`${NAMES[this.turn]} 虚手`);this.passCount++;this.turn=this.turn===BLACK?WHITE:BLACK;this.move++;this.saveSnapshot();if(this.passCount>=2)this.finish();else this.updateUI()}
  saveSnapshot(){this.history.push({board:this.cloneBoard(),turn:this.turn,move:this.move,captures:{...this.captures},passCount:this.passCount,finished:this.finished})}
  undo(){if(this.history.length<=1){notify("已经回到棋局开始");return}this.history.pop();const s=this.history[this.history.length-1];this.board=this.cloneBoard(s.board);this.turn=s.turn;this.move=s.move;this.captures={...s.captures};this.passCount=s.passCount;this.finished=false;
    this.positionHistory=new Set(this.history.map(h=>this.hash(h.board)));this.addLog("悔棋一步");this.updateUI()}
  /* 面积计分：每个连通空区若边界只接触一种颜色，则该空区归该颜色。 */
  calculateScore(){
    let black=0,white=this.komi;const seen=new Set();
    for(let y=0;y<this.size;y++)for(let x=0;x<this.size;x++){if(this.board[y][x]===BLACK){black++;continue}if(this.board[y][x]===WHITE){white++;continue}const key=`${x},${y}`;if(seen.has(key))continue;
      const stack=[[x,y]],region=[],border=new Set();while(stack.length){const [cx,cy]=stack.pop(),k=`${cx},${cy}`;if(seen.has(k))continue;seen.add(k);region.push([cx,cy]);for(const [nx,ny] of this.neighbors(cx,cy)){const v=this.board[ny][nx];if(v===EMPTY&&!seen.has(`${nx},${ny}`))stack.push([nx,ny]);else if(v!==EMPTY)border.add(v)}}
      if(border.size===1){if(border.has(BLACK))black+=region.length;else white+=region.length}}
    return{black,white};
  }
  finish(){if(this.finished)return;this.finished=true;const s=this.calculateScore(),winner=s.black===s.white?"和棋":s.black>s.white?`黑方胜 ${(s.black-s.white).toFixed(1)} 目`:`白方胜 ${(s.white-s.black).toFixed(1)} 目`;this.addLog(`终局：黑 ${s.black.toFixed(1)}，白 ${s.white.toFixed(1)}；${winner}`);notify(winner);this.updateUI(winner)}
  addLog(text){this.logs.push(text);renderLog()}
  updateUI(result=""){turnNameEl.textContent=result||NAMES[this.turn];turnStoneEl.className=`stone${this.turn===WHITE?" white":""}`;moveNoEl.textContent=this.finished?"终局":`第 ${this.move} 手`;blackCapsEl.textContent=this.captures[BLACK];whiteCapsEl.textContent=this.captures[WHITE];passButton.disabled=this.finished;scoreButton.disabled=this.finished;draw()}
}

function boardMetrics(){const pad=54,step=(canvas.width-pad*2)/(game.size-1);return{pad,step}}
function starPoints(size){if(size===19)return[3,9,15];if(size===13)return[3,6,9];return[2,4,6]}
function draw(){
  const {pad,step}=boardMetrics();ctx.clearRect(0,0,canvas.width,canvas.height);const gradient=ctx.createLinearGradient(0,0,800,800);gradient.addColorStop(0,"#e8bd79");gradient.addColorStop(1,"#c98e46");ctx.fillStyle=gradient;ctx.fillRect(0,0,800,800);
  ctx.strokeStyle="#3c2b1c";ctx.lineWidth=1.15;for(let i=0;i<game.size;i++){const p=pad+i*step;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(800-pad,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,800-pad);ctx.stroke()}
  const stars=starPoints(game.size);ctx.fillStyle="#302116";for(const x of stars)for(const y of stars){ctx.beginPath();ctx.arc(pad+x*step,pad+y*step,game.size===19?4:4.5,0,Math.PI*2);ctx.fill()}
  for(let y=0;y<game.size;y++)for(let x=0;x<game.size;x++){const v=game.board[y][x];if(v===EMPTY)continue;drawStone(pad+x*step,pad+y*step,v,step*.43,x,y)}
}
function drawStone(x,y,color,r,gx,gy){const grad=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.12,x,y,r);if(color===BLACK){grad.addColorStop(0,"#555");grad.addColorStop(.4,"#202020");grad.addColorStop(1,"#050505")}else{grad.addColorStop(0,"#fff");grad.addColorStop(.55,"#eeeae0");grad.addColorStop(1,"#aaa79f")}ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=color===BLACK?"#000":"#aaa";ctx.lineWidth=1;ctx.stroke();const last=game.history.length>1&&game.move>1?game.history[game.history.length-1]:null;if(last&&gx===game.lastX&&gy===game.lastY){ctx.strokeStyle=color===BLACK?"#fff":"#222";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r*.24,0,Math.PI*2);ctx.stroke()}}
function coordName(x,y){const letters="ABCDEFGHJKLMNOPQRST";return `${letters[x]}${game.size-y}`}
function notify(text){toastEl.textContent=text;toastEl.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastEl.classList.remove("show"),1800)}
function renderLog(){logEl.innerHTML=game?game.logs.slice(-30).map(x=>`<p>${x}</p>`).join(""):"";logEl.scrollTop=logEl.scrollHeight}
canvas.addEventListener("click",e=>{if(game.finished)return;const rect=canvas.getBoundingClientRect(),scale=canvas.width/rect.width,{pad,step}=boardMetrics(),mx=(e.clientX-rect.left)*scale,my=(e.clientY-rect.top)*scale,x=Math.round((mx-pad)/step),y=Math.round((my-pad)/step);if(x<0||y<0||x>=game.size||y>=game.size)return;if(Math.hypot(mx-(pad+x*step),my-(pad+y*step))>step*.46)return;game.lastX=x;game.lastY=y;game.play(x,y)});
sizeSelect.onchange=()=>game.reset(+sizeSelect.value,+komiSelect.value);komiSelect.onchange=()=>game.komi=+komiSelect.value;restartButton.onclick=()=>game.reset(+sizeSelect.value,+komiSelect.value);undoButton.onclick=()=>game.undo();passButton.onclick=()=>game.pass();scoreButton.onclick=()=>game.finish();game=new GoGame(+sizeSelect.value,+komiSelect.value);game.updateUI();renderLog();
</script>
</body></html>
