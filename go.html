<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>在线围棋</title>
<style>
:root{--bg:#0a1210;--panel:#14201c;--line:#30453b;--gold:#d7b263;--text:#f1f3ef;--muted:#97a79f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 0,#1b392b,transparent 36%),var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif}.app{max-width:1140px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.top h1{margin:0;color:var(--gold);font-size:22px}button{font:inherit;color:var(--text);background:#1b2b24;border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer}button:disabled{opacity:.4}.layout{display:grid;grid-template-columns:minmax(0,800px) 280px;gap:17px}.board-wrap{padding:11px;border:1px solid var(--line);border-radius:14px;background:#111a17}.board{display:block;width:100%;aspect-ratio:1;border-radius:6px;touch-action:none}.side{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:15px}.player{padding:12px;margin-bottom:8px;border:1px solid var(--line);border-radius:9px;color:var(--muted);display:flex;justify-content:space-between}.player.active{border-color:var(--gold);color:var(--text);box-shadow:inset 3px 0 var(--gold)}.stone{display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:7px;vertical-align:-2px;background:#090b0a;border:1px solid #555}.stone.white{background:#fafafa;border-color:#aaa}.status{background:#0d1713;border-radius:9px;min-height:62px;padding:13px;margin:14px 0;line-height:1.7}.meta{font-size:12px;color:var(--muted);line-height:1.9}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.actions .wide{grid-column:1/-1}.danger{color:#ff9e93}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 15px;border:1px solid var(--line);border-radius:20px;background:#050a08ef;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:820px){.app{padding:7px}.layout{grid-template-columns:1fr}.side{padding:11px}.players{display:grid;grid-template-columns:1fr 1fr;gap:7px}.top h1{font-size:18px}}@media(orientation:landscape) and (max-height:620px){.layout{grid-template-columns:minmax(0,calc(100vh - 65px)) 1fr}.side{max-height:calc(100vh - 64px);overflow:auto}.app{max-width:100vw}}
</style></head><body><main class="app"><header class="top"><h1>在线围棋 · 19路</h1><button id="back">返回大厅</button></header><div class="layout"><section class="board-wrap"><canvas id="board" class="board" width="800" height="800"></canvas></section><aside class="side"><div class="players"><div id="black" class="player"><span><i class="stone"></i><b id="blackName">黑方</b></span><span id="blackCap">提子 0</span></div><div id="white" class="player"><span><i class="stone white"></i><b id="whiteName">白方</b></span><span id="whiteCap">提子 0</span></div></div><div id="status" class="status">正在连接房间…</div><div class="meta"><div id="roomCode"></div><div id="moveInfo">黑方先行 · 白贴 6.5 目</div><div>双方连续停一手后，按中国规则进行数子结算。</div></div><div class="actions"><button id="pass">停一手</button><button id="resign" class="danger">认输</button><button id="exit" class="wide danger">退出房间</button></div></aside></div></main><div id="toast" class="toast"></div>
<style>@media(pointer:coarse){.app{width:100%;max-width:540px;padding:6px 7px 18px}.top{margin-bottom:7px}.layout{display:flex;flex-direction:column;gap:8px}.board-wrap{width:100%;padding:4px;border-radius:9px}.side{max-height:none;overflow:visible;padding:9px}.status{min-height:48px;margin:9px 0;padding:9px}.actions{margin-top:10px}.players{grid-template-columns:1fr 1fr}.player{padding:8px;font-size:12px}}</style>
<script>
"use strict";
const canvas=document.querySelector("#board"),ctx=canvas.getContext("2d"),ui={black:document.querySelector("#black"),white:document.querySelector("#white"),blackName:document.querySelector("#blackName"),whiteName:document.querySelector("#whiteName"),blackCap:document.querySelector("#blackCap"),whiteCap:document.querySelector("#whiteCap"),status:document.querySelector("#status"),roomCode:document.querySelector("#roomCode"),moveInfo:document.querySelector("#moveInfo"),pass:document.querySelector("#pass"),resign:document.querySelector("#resign"),exit:document.querySelector("#exit"),back:document.querySelector("#back")};
const roomId=new URLSearchParams(location.search).get("room");let room=null,me=null,state=null,myIndex=-1,busy=false,events=null;const SIZE=800,M=42;
async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||"请求失败");return data}
function toast(message){const el=document.querySelector("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1900)}
function draw(){if(!state)return;const n=state.size,cell=(SIZE-M*2)/(n-1),g=ctx.createLinearGradient(0,0,SIZE,SIZE);g.addColorStop(0,"#e8bd72");g.addColorStop(1,"#c48a3e");ctx.fillStyle=g;ctx.fillRect(0,0,SIZE,SIZE);ctx.strokeStyle="#64431e";ctx.lineWidth=1.5;for(let i=0;i<n;i++){const p=M+i*cell;ctx.beginPath();ctx.moveTo(M,p);ctx.lineTo(SIZE-M,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,M);ctx.lineTo(p,SIZE-M);ctx.stroke()}for(const x of[3,9,15])for(const y of[3,9,15]){ctx.fillStyle="#593719";ctx.beginPath();ctx.arc(M+x*cell,M+y*cell,4.5,0,Math.PI*2);ctx.fill()}for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=state.board[y][x];if(!v)continue;const px=M+x*cell,py=M+y*cell,r=cell*.44,grad=ctx.createRadialGradient(px-r*.35,py-r*.4,1,px,py,r);grad.addColorStop(0,v===1?"#727876":"#fff");grad.addColorStop(1,v===1?"#070908":"#c8cecb");ctx.fillStyle=grad;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=v===1?"#020302":"#9da5a1";ctx.stroke()}if(state.lastMove?.x>=0){ctx.strokeStyle="#ee574d";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(M+state.lastMove.x*cell,M+state.lastMove.y*cell,cell*.12,0,Math.PI*2);ctx.stroke()}}
function update(){if(!room||!state)return;ui.blackName.textContent=room.host.username;ui.whiteName.textContent=room.guest.username;ui.blackCap.textContent=`提子 ${state.captures[0]}`;ui.whiteCap.textContent=`提子 ${state.captures[1]}`;ui.black.classList.toggle("active",state.status==="PLAYING"&&state.currentTurn===0);ui.white.classList.toggle("active",state.status==="PLAYING"&&state.currentTurn===1);ui.roomCode.textContent=`房间 ${room.id.slice(-6).toUpperCase()} · 你执${myIndex===0?"黑":"白"}`;if(state.status==="FINISHED"){if(state.result?.reason==="SCORE")ui.status.textContent=`终局：黑 ${state.result.score.black}，白 ${state.result.score.white}（含贴目）· ${state.winner===myIndex?"你获胜":"对手获胜"}`;else ui.status.textContent=state.winner===myIndex?"对手认输，你获胜":"你已认输，对手获胜"}else ui.status.textContent=state.currentTurn===myIndex?"轮到你落子":"等待对手落子";const m=state.lastMove;ui.moveInfo.textContent=m?.pass?`${m.player===0?"黑方":"白方"}停一手 · 连续 ${state.passCount} 次`:m?.resign?`${m.player===0?"黑方":"白方"}认输`:m?.x>=0?`第 ${state.moveNumber} 手 · ${String.fromCharCode(65+m.x+(m.x>=8?1:0))}${state.size-m.y}${m.captured?` · 提 ${m.captured} 子`:""}`:"黑方先行 · 白贴 6.5 目";ui.pass.disabled=ui.resign.disabled=state.status!=="PLAYING"||state.currentTurn!==myIndex;draw()}
function point(event){const rect=canvas.getBoundingClientRect(),sx=(event.clientX-rect.left)*SIZE/rect.width,sy=(event.clientY-rect.top)*SIZE/rect.height,cell=(SIZE-M*2)/(state.size-1),x=Math.round((sx-M)/cell),y=Math.round((sy-M)/cell);return x>=0&&y>=0&&x<state.size&&y<state.size&&Math.hypot(sx-(M+x*cell),sy-(M+y*cell))<cell*.48?{x,y}:null}
async function action(payload){if(busy)return;busy=true;try{const result=await api(`/api/rooms/${roomId}/board-action`,{method:"POST",body:JSON.stringify(payload)});state=result.state;update()}catch(error){toast(error.message)}finally{busy=false}}
canvas.addEventListener("pointerdown",event=>{event.preventDefault();if(!state||state.status!=="PLAYING")return;if(state.currentTurn!==myIndex)return toast("还没轮到你");const p=point(event);if(p)action({type:"GO_MOVE",...p})});
async function sync(){const result=await api(`/api/rooms/${roomId}`);if(result.room.mode!=="GO"||result.room.status!=="STARTED")throw Error("该房间不是进行中的围棋房间");room=result.room;me=result.me;myIndex=room.host.id===me.id?0:1;state=room.game.go;update()}
function connect(){events=new EventSource("/api/events");events.onmessage=event=>{const message=JSON.parse(event.data);if(message.roomId&&message.roomId!==roomId)return;if(message.type==="GO_STATE"){state=message.state;update()}else if(message.type==="ROOM_CLOSED"){alert(message.reason||"房间已关闭");location.href="/lobby.html"}};events.onerror=()=>setTimeout(()=>sync().catch(()=>{}),800)}
ui.pass.onclick=()=>{if(state?.currentTurn===myIndex&&confirm("确定停一手？双方连续停一手将立即结算。"))action({type:"GO_PASS"})};ui.resign.onclick=()=>{if(state?.currentTurn===myIndex&&confirm("确定认输？"))action({type:"GO_RESIGN"})};ui.exit.onclick=async()=>{if(!confirm("确定退出房间？进行中的对局将结束。"))return;try{await api(`/api/rooms/${roomId}/exit`,{method:"POST"})}finally{location.href="/lobby.html"}};ui.back.onclick=()=>location.href="/lobby.html";
if(!roomId)location.href="/lobby.html";else sync().then(connect).catch(error=>{alert(error.message);location.href="/lobby.html"});
</script></body></html>
